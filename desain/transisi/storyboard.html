<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transisi antarseksi</title>
<style>
  :root { --bg:#161514; --ink:#ede8e0; --ink2:#9a948b; --line:#3a3734; --merah:#e05a4a; --kuning:#ffd84a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--ink2); margin:0 0 20px; font-family:ui-monospace, monospace; font-size:13px; }
  .kendali { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:24px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
  .kendali input { width:min(420px, 60vw); }
  button { background:var(--ink); color:var(--bg); border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:28px; }
  .kartu h2 { font-size:17px; margin:0; display:flex; gap:8px; align-items:center; }
  .tag { background:var(--merah); color:#fff; font-size:11px; padding:2px 7px; border-radius:4px; font-weight:600; }
  .kartu p { margin:4px 0 10px; color:var(--ink2); font-size:13.5px; }
  .vp { position:relative; aspect-ratio:16/10; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#1e1a17; }
  .sek { position:absolute; inset:0; display:grid; place-items:center; }
  .A { background:#1e1a17; }
  .A b { font-size:26px; letter-spacing:-.02em; }
  .kertas { position:absolute; width:46px; height:46px; background:#f3ecdf; border-radius:3px; box-shadow:0 4px 10px #0008; left:62%; top:62%; }
  .B { background:#141821; }
  .rak { position:relative; width:78%; height:46%; perspective:300px; display:flex; justify-content:center; align-items:center; gap:5px; }
  .rak i { width:7%; height:92%; background:#3c4250; border-radius:2px; transform:rotateY(38deg); }
  .rak i.c { width:26%; aspect-ratio:1; height:auto; transform:none; background:linear-gradient(135deg, var(--merah), #7b2c55); }
  .label { position:absolute; left:8px; bottom:6px; font:11px ui-monospace, monospace; color:var(--ink2); }
  .kristal { position:absolute; background:linear-gradient(160deg,#cfe6ff,#5d7fa8); opacity:.75; clip-path:polygon(50% 0,100% 40%,70% 100%,20% 90%,0 35%); }
  .muat { position:absolute; inset:0; background:#0c0c0c; display:grid; place-items:center; font:12px ui-monospace, monospace; color:var(--ink2); }
  .muat div { width:60%; height:3px; background:#333; margin-top:8px; }
  .muat div span { display:block; height:100%; background:var(--ink); }
</style>
</head>
<body>
<h1>Transisi antarseksi: 6 pilihan</h1>
<p class="sub">Tiap kotak = layar pengunjung. Seksi atas "Cerita", seksi bawah "Rak CD". Geser penggeser untuk menggulir melewati batas seksi, atau biarkan berputar sendiri.</p>
<div class="kendali">
  <button id="putar">Jeda</button>
  <input id="gulir" type="range" min="0" max="1000" value="0" aria-label="Posisi gulir">
  <span id="angka" style="font-family:ui-monospace,monospace;font-size:13px">0%</span>
</div>
<div class="grid" id="grid"></div>
<script>
const opsi = [
  { t:"1. Tumpang tindih + warna menyatu", r:1, d:"Cerita menempel di tempat, rak naik menutupinya dari bawah. Warna latar bergeser pelan, jadi batasnya tidak terlihat." },
  { t:"2. Benda yang menyeberang", r:1, d:"Kertas kecil di cerita lepas, mengecil, terbang, lalu mendarat jadi sampul CD di tengah rak. Mata ikut bendanya." },
  { t:"3. Rak bocor keluar seksinya", d:"Rak sudah samar di belakang judul cerita, makin jelas saat judul memudar." },
  { t:"4. Topeng shader di batas rak", d:"Rak muncul lewat bukaan berbentuk retakan es dengan tepi warna merah dan biru, seperti Igloo." },
  { t:"5. Gulir berbobot (desktop)", d:"Potongan seksi tetap biasa, tetapi halaman meluncur dan mengendap pelan seperti punya bobot." },
  { t:"6. Model Igloo penuh", d:"Ada layar memuat dulu, lalu kamera terbang di satu dunia 3D melewati kristal menuju rak." },
];
const grid = document.getElementById("grid");
const vp = opsi.map((o, i) => {
  const k = document.createElement("div");
  k.className = "kartu";
  k.innerHTML = `<h2>${o.t}${o.r ? '<span class="tag">Rekomendasi</span>' : ""}</h2><p>${o.d}</p>
  <div class="vp"><div class="sek B"><div class="rak">${'<i></i>'.repeat(3)}<i class="c"></i>${'<i></i>'.repeat(3)}</div></div>
  <div class="sek A"><b>Dari demo ke rak</b><div class="kertas"></div></div><span class="label"></span></div>`;
  grid.append(k);
  return k.querySelector(".vp");
});
// Tambahan untuk pilihan 4 dan 6.
vp[3].insertAdjacentHTML("beforeend", `<svg width="0" height="0" style="position:absolute"><filter id="es"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="3"/><feDisplacementMap in="SourceGraphic" scale="40"/></filter></svg>`);
vp[5].insertAdjacentHTML("beforeend", Array.from({length:7}, (_, i) => `<div class="kristal" data-i="${i}"></div>`).join("") + `<div class="muat">Memuat <div><span></span></div></div>`);

const lerp = (a, b, t) => a + (b - a) * t;
const jepit = (x) => Math.min(1, Math.max(0, x));
const halus = (x) => x * x * (3 - 2 * x);
const warna = (t) => `rgb(${lerp(30,20,t)|0},${lerp(26,24,t)|0},${lerp(23,33,t)|0})`;
let lambat = 0;

function gambar(p) {
  for (const v of vp) v.querySelector(".label").textContent = `gulir ${Math.round(p * 100)}%`;
  const q = (v, s) => v.querySelector(s);
  // 1: A menempel, B naik menutupi, latar menyatu.
  {
    const v = vp[0], t = halus(p);
    q(v, ".A").style.cssText = `transform:scale(${1 - t * 0.06});filter:brightness(${1 - t * 0.5});background:${warna(t)}`;
    q(v, ".B").style.cssText = `transform:translateY(${(1 - t) * 100}%);background:${warna(Math.max(t, .6))};z-index:2;box-shadow:0 -20px 40px #0009`;
  }
  // 2: halaman bergulir biasa, kertas terbang ke tengah rak.
  {
    const v = vp[1], t = halus(p);
    q(v, ".A").style.transform = `translateY(${-t * 100}%)`;
    q(v, ".B").style.transform = `translateY(${(1 - t) * 100}%)`;
    const kr = q(v, ".kertas");
    v.append(kr);
    const x = lerp(62, 37, t), y = lerp(62, 27, t) - Math.sin(t * Math.PI) * 25;
    kr.style.cssText = `left:${x}%;top:${y}%;width:${lerp(46, 88, t)}px;height:${lerp(46, 88, t)}px;transform:rotate(${(1 - t) * -20 + Math.sin(t * Math.PI) * 30}deg);z-index:3;background:${t > .9 ? "linear-gradient(135deg,#e05a4a,#7b2c55)" : "#f3ecdf"}`;
    q(v, ".rak i.c").style.opacity = t > .95 ? 1 : 0;
  }
  // 3: rak di belakang A, A memudar.
  {
    const v = vp[2];
    q(v, ".A").style.cssText = `background:transparent;opacity:${1 - halus(jepit((p - .35) / .5))}`;
    q(v, ".B").style.cssText = `opacity:${.15 + .85 * halus(p)};transform:scale(${lerp(1.15, 1, halus(p))})`;
    q(v, ".kertas").style.opacity = 1 - p;
  }
  // 4: rak muncul lewat topeng retakan es.
  {
    const v = vp[3], r = halus(p) * 75;
    const B = q(v, ".B");
    B.style.cssText = `z-index:2;clip-path:circle(${r}% at 50% 55%);filter:url(#es) drop-shadow(3px 0 0 #e05a4a) drop-shadow(-3px 0 0 #4a8bff)`;
    q(v, ".A").style.filter = `blur(${p * 3}px)`;
  }
  // 5: halaman mengejar posisi gulir dengan lambat (inersia).
  {
    const v = vp[4];
    lambat += (p - lambat) * 0.06;
    q(v, ".A").style.transform = `translateY(${-lambat * 100}%)`;
    q(v, ".B").style.transform = `translateY(${(1 - lambat) * 100}%)`;
  }
  // 6: memuat dulu, lalu kamera terbang melewati kristal.
  {
    const v = vp[5], m = jepit(p / .3), f = halus(jepit((p - .3) / .7));
    q(v, ".muat").style.opacity = m < 1 ? 1 : 0;
    q(v, ".muat span").style.width = `${m * 100}%`;
    q(v, ".A").style.cssText = `background:#0b1220;opacity:${1 - f}`;
    q(v, ".A b").style.transform = `scale(${1 + f * 3})`;
    q(v, ".B").style.cssText = `background:#0b1220;transform:scale(${lerp(.2, 1, f)})`;
    v.querySelectorAll(".kristal").forEach((k) => {
      const i = +k.dataset.i, s = 20 + f * 260 * (0.5 + i / 7);
      const ax = [10, 80, 25, 70, 45, 5, 90][i], ay = [20, 15, 70, 75, 10, 50, 45][i];
      k.style.cssText = `width:${s}px;height:${s}px;left:${50 + (ax - 50) * (1 + f * 2)}%;top:${50 + (ay - 50) * (1 + f * 2)}%;transform:translate(-50%,-50%);opacity:${f < .95 ? .75 : 0}`;
    });
  }
}

const gulir = document.getElementById("gulir"), angka = document.getElementById("angka"), tombol = document.getElementById("putar");
let main = true, t0 = performance.now(), pManual = 0;
tombol.onclick = () => { main = !main; tombol.textContent = main ? "Jeda" : "Putar"; t0 = performance.now() - pManual * 3500; };
gulir.oninput = () => { main = false; tombol.textContent = "Putar"; pManual = gulir.value / 1000; };
function loop(now) {
  // Putar otomatis: 3,5 s turun, jeda, lalu ulang dari atas.
  if (main) { const s = ((now - t0) / 3500) % 1.4; pManual = Math.min(1, s); gulir.value = pManual * 1000; }
  angka.textContent = Math.round(pManual * 100) + "%";
  gambar(pManual);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
