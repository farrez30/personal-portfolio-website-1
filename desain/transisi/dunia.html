<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunia toko kaset</title>
<style>
  :root { --bg:#161514; --ink:#ede8e0; --ink2:#9a948b; --line:#3a3734; --merah:#e05a4a; --kuning:#ffd84a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--ink2); margin:0 0 16px; font:13px ui-monospace, monospace; }
  .kendali { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .kendali input { width:min(520px, 70vw); }
  button { background:var(--ink); color:var(--bg); border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .susun { display:grid; grid-template-columns:minmax(260px, 1fr) minmax(320px, 2fr); gap:20px; align-items:start; }
  @media (max-width:760px) { .susun { grid-template-columns:1fr; } .susun > .panel:first-child { order:2; max-width:240px; } }
  .panel { border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; }
  .judul-panel { font:11px ui-monospace, monospace; color:var(--ink2); padding:6px 10px; border-bottom:1px solid var(--line); }
  svg { display:block; width:100%; height:auto; background:#120f0d; }
  .pov { position:relative; aspect-ratio:16/10; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .dom { position:absolute; left:6%; top:8%; max-width:60%; pointer-events:none; }
  .dom small { font:10px ui-monospace, monospace; color:var(--ink2); }
  .dom b { display:block; font-size:clamp(15px, 2.4vw, 24px); line-height:1.1; letter-spacing:-.02em; margin-top:4px; text-shadow:0 2px 8px #000; }
  .catatan { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
  .catatan div { border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; color:var(--ink2); }
  .catatan div.aktif { border-color:var(--merah); color:var(--ink); }
  .catatan strong { color:var(--ink); display:block; font-size:13.5px; }
</style>
</head>
<body>
<h1>Konsep B: ruang dengar toko kaset</h1>
<p class="sub">Satu dunia 3D, satu kamera. Gulir halaman = kamera berjalan di dalam toko setelah tutup. Teks tetap HTML di atas kanvas. Mulai sesudah ular melahap layar.</p>
<div class="kendali">
  <button id="putar">Jeda</button>
  <input id="gulir" type="range" min="0" max="1000" value="0" aria-label="Posisi gulir">
  <span id="angka" style="font:13px ui-monospace,monospace">0%</span>
</div>
<div class="susun">
  <div class="panel"><div class="judul-panel">DENAH TOKO (dilihat dari atas): titik merah = kamera</div>
    <svg viewBox="0 0 300 300" id="denah">
      <rect x="10" y="10" width="280" height="280" fill="#1b1714" stroke="#3a3734"/>
      <rect x="20" y="200" width="70" height="80" fill="#2a2420" stroke="#5a4d43"/><text x="26" y="245" fill="#9a948b" font-size="10">Bilik dengar</text>
      <rect x="110" y="20" width="170" height="14" fill="#3b3029"/><text x="120" y="48" fill="#9a948b" font-size="10">Dinding catatan sampul</text>
      <rect x="210" y="70" width="18" height="140" fill="#3c4250"/><rect x="250" y="70" width="18" height="140" fill="#3c4250"/><text x="196" y="226" fill="#9a948b" font-size="10">Rak CD</text>
      <rect x="110" y="235" width="80" height="22" fill="#4a3a2a"/><text x="118" y="272" fill="#9a948b" font-size="10">Meja kasir</text>
      <rect x="280" y="240" width="10" height="40" fill="#e05a4a"/><text x="232" y="296" fill="#9a948b" font-size="10">Pintu</text>
      <path id="jalur" d="M55 240 C 70 120, 110 70, 170 60 S 230 90, 239 140 S 200 230, 150 225 S 250 255, 272 260" fill="none" stroke="#e05a4a" stroke-dasharray="4 4" opacity=".55"/>
      <g id="kamera"><circle r="6" fill="#e05a4a"/><path d="M0 0 L22 -9 L22 9 Z" fill="#e05a4a" opacity=".35"/></g>
    </svg>
  </div>
  <div class="panel"><div class="judul-panel" id="label-pov">SUDUT PANDANG PENGUNJUNG</div>
    <div class="pov"><canvas id="cv"></canvas><div class="dom"><small id="kecil"></small><b id="besar"></b></div></div>
  </div>
</div>
<div class="catatan" id="catatan"></div>
<script>
// Lima tempat, satu per seksi situs. a..b = rentang gulir; trans = efek ke tempat berikutnya.
const tempat = [
  { n:"Hero: bilik dengar", a:0, b:.18, kecil:"Implementation, business analysis, dan delivery.", besar:"Bukan sekadar sistem yang selesai dibuat,", trans:"Fokus bergeser dari headphone ke dinding, gambar sedikit bergoyang seperti suara berdengung.", w:"#2a2018" },
  { n:"Cerita: dinding catatan sampul", a:.2, b:.42, kecil:"Cerita", besar:"Dari demo ke dipakai tiap hari", trans:"Kamera menoleh cepat ke rak; garis-garis gerak menyamarkan potongannya.", w:"#2b241c" },
  { n:"Proyek: rak CD", a:.45, b:.66, kecil:"Proyek", besar:"Ambil satu album", trans:"CD diangkat ke lampu; kilau pelangi CD memenuhi layar lalu reda di meja kasir.", w:"#161b24" },
  { n:"Klien: meja kasir", a:.7, b:.84, kecil:"Klien dan mitra", besar:"Stiker label di meja kasir", trans:"Pintu terbuka; cahaya jalan masuk dan membawa kita ke kontak.", w:"#251c14" },
  { n:"Kontak: pintu dan lonceng", a:.88, b:1, kecil:"Kontak", besar:"Lonceng pintu berbunyi. Mari ngobrol.", trans:"Akhir halaman.", w:"#2a1f1a" },
];
const catatan = document.getElementById("catatan");
tempat.forEach((t, i) => catatan.insertAdjacentHTML("beforeend", `<div><strong>${i + 1}. ${t.n}</strong>${t.trans}</div>`));
const kartu = [...catatan.children];
const jalur = document.getElementById("jalur"), panjang = jalur.getTotalLength(), kam = document.getElementById("kamera");
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const jepit = (x) => Math.min(1, Math.max(0, x)), halus = (x) => x * x * (3 - 2 * x);

function adegan(i, W, H, k) {
  // Gambar sederhana tiap tempat. k = 0..1 di dalam tempat itu (kamera bergerak sedikit).
  const t = tempat[i];
  g.fillStyle = t.w; g.fillRect(0, 0, W, H);
  g.fillStyle = "#00000055"; g.fillRect(0, H * .72, W, H * .28);
  const geser = (k - .5) * W * .08;
  if (i === 0) {
    g.fillStyle = "#3a2e25"; g.fillRect(W * .55 + geser, H * .15, W * .38, H * .6);
    g.strokeStyle = "#b9b2a6"; g.lineWidth = W * .012;
    g.beginPath(); g.arc(W * .74 + geser, H * .42, W * .07, Math.PI, 0); g.stroke();
    g.fillStyle = "#1a1a1a"; g.fillRect(W * .655 + geser, H * .4, W * .035, H * .12); g.fillRect(W * .79 + geser, H * .4, W * .035, H * .12);
  } else if (i === 1) {
    for (let x = 0; x < 9; x++) { g.fillStyle = x % 3 ? "#e9dfcc" : "#d8c9ad"; g.save(); g.translate(W * (.1 + x * .1) + geser, H * (.35 + (x % 2) * .12)); g.rotate((x % 3 - 1) * .08); g.fillRect(0, 0, W * .075, H * .13); g.restore(); }
  } else if (i === 2) {
    for (let x = 0; x < 12; x++) { g.fillStyle = x === 6 ? "#e05a4a" : ["#3c4250", "#4a5262", "#565e70"][x % 3]; g.fillRect(W * (.08 + x * .07) + geser, H * .3, W * .05, H * .4); }
  } else if (i === 3) {
    g.fillStyle = "#4a3a2a"; g.fillRect(W * .15, H * .55, W * .7, H * .2);
    ["#e05a4a", "#ffd84a", "#5aa8ff", "#6bff9e", "#c46bff"].forEach((w, j) => { g.fillStyle = w; g.beginPath(); g.arc(W * (.25 + j * .12) + geser, H * .6, W * .028, 0, 7); g.fill(); });
  } else {
    g.fillStyle = "#11100f"; g.fillRect(W * .58, H * .12, W * .26, H * .6);
    g.fillStyle = "#ffe9b8"; g.globalAlpha = .25 + k * .5; g.fillRect(W * .6, H * .14, W * .22 * (.3 + k * .7), H * .56); g.globalAlpha = 1;
    g.fillStyle = "#d4b25a"; g.beginPath(); g.arc(W * .71, H * .09, W * .02, 0, 7); g.fill();
  }
}

function gambar(p) {
  const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.filter = "none"; g.globalAlpha = 1;
  // Kamera di denah.
  const pt = jalur.getPointAtLength(p * panjang), dp = jalur.getPointAtLength(Math.min(panjang, p * panjang + 2));
  kam.setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${Math.atan2(dp.y - pt.y, dp.x - pt.x) * 57.3})`);
  // Tempat aktif atau transisi di antara dua tempat.
  let i = tempat.findIndex((t) => p >= t.a && p <= t.b);
  const besar = document.getElementById("besar"), kecil = document.getElementById("kecil");
  kartu.forEach((k, j) => k.classList.toggle("aktif", j === i || (i < 0 && j === tempat.findIndex((t) => p < t.a) - 1)));
  if (i >= 0) {
    const t = tempat[i], k = (p - t.a) / (t.b - t.a);
    adegan(i, W, H, k);
    besar.textContent = t.besar; kecil.textContent = t.kecil;
    besar.parentElement.style.opacity = halus(jepit(Math.min(k * 4, (1 - k) * 4)));
    document.getElementById("label-pov").textContent = "SUDUT PANDANG PENGUNJUNG: " + t.n;
    return;
  }
  const j = tempat.findIndex((t) => p < t.a) - 1, u = halus((p - tempat[j].b) / (tempat[j + 1].a - tempat[j].b));
  besar.parentElement.style.opacity = 0;
  document.getElementById("label-pov").textContent = "TRANSISI: " + tempat[j].trans;
  if (j === 0) { g.filter = `blur(${Math.sin(u * Math.PI) * 6}px)`; adegan(u < .5 ? 0 : 1, W, H, u < .5 ? 1 : 0); g.filter = "none"; g.fillStyle = "#ffffff10"; for (let y = 0; y < H; y += 6) g.fillRect(Math.sin(y * .2 + u * 30) * 6 * Math.sin(u * Math.PI), y, W, 2); }
  else if (j === 1) { const dx = (u - .5) * W * 1.4; g.save(); g.translate(-dx * .3, 0); g.filter = `blur(${Math.sin(u * Math.PI) * 14}px)`; adegan(u < .5 ? 1 : 2, W, H, .5); g.restore(); g.filter = "none"; g.strokeStyle = "#ffffff22"; for (let y = 10; y < H; y += 14) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); } }
  else if (j === 2) { adegan(u < .5 ? 2 : 3, W, H, .5); const r = Math.sin(u * Math.PI); const gr = g.createConicGradient(u * 6, W / 2, H / 2); ["#ff6b6b", "#ffd84a", "#6bff9e", "#5aa8ff", "#c46bff", "#ff6b6b"].forEach((w, q) => gr.addColorStop(q / 5, w)); g.globalAlpha = r * .85; g.fillStyle = gr; g.beginPath(); g.arc(W / 2, H / 2, r * W * .8, 0, 7); g.fill(); g.globalAlpha = 1; }
  else { adegan(u < .6 ? 3 : 4, W, H, 0); const gr = g.createLinearGradient(W, 0, 0, 0); gr.addColorStop(0, `rgba(255,233,184,${Math.sin(u * Math.PI)})`); gr.addColorStop(1, "rgba(255,233,184,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
}

const gulir = document.getElementById("gulir"), angka = document.getElementById("angka"), tombol = document.getElementById("putar");
let main = true, t0 = performance.now(), p = 0;
tombol.onclick = () => { main = !main; tombol.textContent = main ? "Jeda" : "Putar"; t0 = performance.now() - p * 14000; };
gulir.oninput = () => { main = false; tombol.textContent = "Putar"; p = gulir.value / 1000; };
(function loop(now) {
  if (main) { p = ((now - t0) / 14000) % 1; gulir.value = p * 1000; }
  angka.textContent = Math.round(p * 100) + "%";
  gambar(p);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
