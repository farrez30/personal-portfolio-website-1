<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader melahap layar</title>
<style>
  :root { --bg:#161514; --ink:#ede8e0; --ink2:#9a948b; --line:#3a3734; --merah:#e05a4a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--ink2); margin:0 0 20px; font:13px ui-monospace, monospace; }
  .kendali { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
  .kendali input { width:min(420px, 60vw); }
  button { background:var(--ink); color:var(--bg); border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:28px; }
  .kartu h2 { font-size:17px; margin:0; display:flex; gap:8px; align-items:center; }
  .kartu p { margin:4px 0 10px; color:var(--ink2); font-size:13.5px; }
  .vp { position:relative; aspect-ratio:16/10; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .hero { position:absolute; inset:0; background:#1e1a17; padding:9% 8%; }
  .hero small { font:10px ui-monospace, monospace; color:var(--ink2); }
  .hero b { display:block; font-size:clamp(18px, 3.2vw, 26px); line-height:1.08; margin-top:6px; letter-spacing:-.02em; }
  .hero span { display:inline-block; margin-top:12px; background:var(--merah); color:#fff; font-size:11px; padding:5px 9px; border-radius:3px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .fase { position:absolute; left:8px; bottom:6px; font:11px ui-monospace, monospace; color:var(--ink2); z-index:2; text-shadow:0 1px 2px #000; }
</style>
</head>
<body>
<h1>Loader yang melahap layar</h1>
<p class="sub">Memuat: berputar seperti spinner, makin panjang mengikuti progres. 100%: meliuk ke arah kita, mulutnya membesar, dan di dalam mulut sudah ada hero.</p>
<div class="kendali">
  <button id="putar">Jeda</button>
  <input id="waktu" type="range" min="0" max="1000" value="0" aria-label="Waktu">
  <span id="angka" style="font:13px ui-monospace,monospace">0.0 s</span>
</div>
<div class="grid" id="grid"></div>
<script>
const varian = [
  { id:"ular", t:"1. Ular", d:"Ide Anda apa adanya: ular berputar sebagai spinner, lalu meliuk, menerjang, dan mulutnya menjadi pintu ke hero." },
  { id:"kabel", t:"2. Kabel audio", d:"Gerak ular yang sama, tapi tubuhnya kabel dan kepalanya colokan jack. Lubang colokan yang membesar jadi pintu ke hero." },
  { id:"cd", t:"3. Lubang tengah CD", d:"CD berputar makin cepat, kilau pelanginya mengisi sesuai progres. Di 100% CD menghadap kita dan lubangnya membesar." },
];
const DUR = 7.5, MUAT = 3.4, LIUK = 5.0, TERKAM = 6.0;
const grid = document.getElementById("grid");
const papan = varian.map((v) => {
  const k = document.createElement("div");
  k.className = "kartu";
  k.innerHTML = `<h2>${v.t}</h2><p>${v.d}</p><div class="vp"><div class="hero"><small>Implementation, business analysis, dan delivery.</small><b>Bukan sekadar sistem yang selesai dibuat,</b><span>Lihat proyek</span></div><canvas></canvas><span class="fase"></span></div>`;
  grid.append(k);
  return { ...v, cv:k.querySelector("canvas"), fase:k.querySelector(".fase"), jejak:[] };
});

const jepit = (x) => Math.min(1, Math.max(0, x));
const halus = (x) => x * x * (3 - 2 * x);
const masuk = (x) => x * x * x;

// Posisi kepala (0..1 relatif kanvas) dan skala menurut waktu.
function kepala(t) {
  if (t < MUAT) {
    const a = t * 4.2;
    return { x:.5 + Math.cos(a) * .16, y:.5 + Math.sin(a) * .26, s:1, a:a + Math.PI / 2 };
  }
  const a0 = MUAT * 4.2, x0 = .5 + Math.cos(a0) * .16, y0 = .5 + Math.sin(a0) * .26;
  if (t < LIUK) {
    // Meliuk: keluar dari lingkaran ke tengah sambil mengayun kiri kanan, makin dekat ke kamera.
    const u = halus((t - MUAT) / (LIUK - MUAT));
    const ayun = Math.sin(u * Math.PI * 4) * .14 * (1 - u * .6);
    const x = x0 + (.5 - x0) * u + ayun, y = y0 + (.62 - y0) * u;
    return { x, y, s:1 + u * 1.6, a:Math.atan2(.62 - y0, .5 - x0) + Math.cos(u * Math.PI * 4) * .9 };
  }
  // Menerjang: kepala menghadap kamera dan membesar cepat.
  const u = jepit((t - LIUK) / (TERKAM - LIUK));
  return { x:.5, y:.62 - u * .12, s:2.6 + masuk(u) * 40, a:-Math.PI / 2, terkam:u };
}

function gambar(p, t) {
  const c = p.cv, W = c.clientWidth, H = c.clientHeight, dpr = devicePixelRatio || 1;
  if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = "source-over";
  g.clearRect(0, 0, W, H);
  const progres = jepit(t / MUAT);
  p.fase.textContent = t < MUAT ? `memuat ${Math.round(progres * 100)}%` : t < LIUK ? "100%: meliuk" : t < TERKAM ? "menerjang" : "di hero";
  if (t >= TERKAM) return;

  // Layar loader gelap menutupi hero.
  g.fillStyle = "#0d0c0b";
  g.fillRect(0, 0, W, H);
  const U = Math.min(W, H);

  if (p.id === "cd") {
    const u = jepit((t - MUAT) / (TERKAM - MUAT));
    const r = U * .26 * (1 + masuk(jepit((t - LIUK) / (TERKAM - LIUK))) * 18);
    const miring = t < MUAT ? .35 : .35 + halus(jepit((t - MUAT) / (LIUK - MUAT))) * .65;
    const putar = t * (2 + progres * 10 + u * 20);
    g.save();
    g.translate(W / 2, H / 2);
    g.scale(1, miring);
    g.rotate(putar);
    const grad = g.createConicGradient(0, 0, 0);
    ["#c0c4cc", "#ff6b6b", "#ffd84a", "#6bff9e", "#5aa8ff", "#c46bff", "#c0c4cc"].forEach((w, i) => grad.addColorStop(i / 6, w));
    g.fillStyle = "#9aa0aa";
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, 0, Math.PI * 2 * Math.max(progres, u > 0 ? 1 : 0)); g.fill();
    g.fillStyle = "#e9ecf0";
    g.beginPath(); g.arc(0, 0, r * .3, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = "destination-out";
    g.beginPath(); g.arc(0, 0, r * .13 * (1 + halus(jepit((t - LIUK) / (TERKAM - LIUK))) * 2.5), 0, Math.PI * 2); g.fill();
    g.restore();
    // Lubang juga tembus layar gelap supaya hero terlihat di dalamnya.
    g.globalCompositeOperation = "destination-out";
    g.beginPath();
    g.ellipse(W / 2, H / 2, r * .13 * (1 + halus(jepit((t - LIUK) / (TERKAM - LIUK))) * 2.5), r * .13 * miring * (1 + halus(jepit((t - LIUK) / (TERKAM - LIUK))) * 2.5), 0, 0, Math.PI * 2);
    g.fill();
    return;
  }

  // Jejak tubuh: hitung ulang dari waktu supaya penggeser bisa maju mundur.
  const n = Math.round(8 + progres * 28);
  const tubuh = [];
  for (let i = n; i >= 1; i--) {
    const ti = t - i * .028;
    if (ti < 0) continue;
    tubuh.push(kepala(ti));
  }
  const h = kepala(t);
  const terkam = h.terkam ?? 0;
  const tebal = U * (p.id === "ular" ? .045 : .02);

  // Tubuh memudar saat kepala menerjang, kepala memenuhi layar.
  g.globalAlpha = 1 - terkam;
  tubuh.forEach((b, i) => {
    const k = (i + 1) / tubuh.length;
    g.fillStyle = p.id === "ular" ? (i % 2 ? "#3f7a4e" : "#5b9a63") : "#222";
    g.strokeStyle = p.id === "kabel" ? "#555" : "transparent";
    g.beginPath();
    g.arc(b.x * W, b.y * H, tebal * b.s * (p.id === "ular" ? .45 + k * .55 : 1), 0, Math.PI * 2);
    g.fill(); g.stroke();
  });
  g.globalAlpha = 1;

  g.save();
  g.translate(h.x * W, h.y * H);
  g.rotate(h.a);
  const r = tebal * h.s * (p.id === "ular" ? 1.25 : 1.6);
  if (terkam < .15) {
    if (p.id === "ular") {
      g.fillStyle = "#6fb075";
      g.beginPath(); g.ellipse(r * .4, 0, r * 1.4, r, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#ffd84a";
      g.beginPath(); g.arc(r * .9, -r * .45, r * .22, 0, 7); g.arc(r * .9, r * .45, r * .22, 0, 7); g.fill();
      g.strokeStyle = "#e05a4a"; g.lineWidth = Math.max(1, r * .12);
      g.beginPath(); g.moveTo(r * 1.8, 0); g.lineTo(r * 2.4, 0); g.lineTo(r * 2.7, -r * .3); g.moveTo(r * 2.4, 0); g.lineTo(r * 2.7, r * .3); g.stroke();
    } else {
      g.fillStyle = "#2a2a2a"; g.fillRect(-r, -r * .7, r * 1.6, r * 1.4);
      g.fillStyle = "#c8ccd2"; g.fillRect(r * .6, -r * .28, r * 2, r * .56);
      g.fillStyle = "#8a8f96"; g.fillRect(r * 1.3, -r * .3, r * .12, r * .6); g.fillRect(r * 1.8, -r * .3, r * .12, r * .6);
    }
    g.restore();
    return;
  }
  g.restore();

  // Menerjang: kepala menghadap kamera. Mulut (atau lubang colokan) dibuka tembus ke hero.
  const R = U * .05 * h.s, cx = W / 2, cy = h.y * H;
  const buka = halus(jepit((terkam - .1) / .6));
  if (p.id === "ular") {
    g.fillStyle = "#5b9a63";
    g.beginPath(); g.ellipse(cx, cy, R * 1.3, R * 1.1, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ffd84a";
    g.beginPath(); g.arc(cx - R * .55, cy - R * .75, R * .14, 0, 7); g.arc(cx + R * .55, cy - R * .75, R * .14, 0, 7); g.fill();
    g.fillStyle = "#7a1f2a";
    g.beginPath(); g.ellipse(cx, cy + R * .1, R * 1.05, R * .85 * buka, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#f3ecdf";
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * R * .45, cy - R * .6 * buka); g.lineTo(cx + s * R * .32, cy - R * .1 * buka); g.lineTo(cx + s * R * .58, cy - R * .5 * buka); g.fill(); }
    g.globalCompositeOperation = "destination-out";
    g.beginPath(); g.ellipse(cx, cy + R * .15, R * .92, R * .72 * buka, 0, 0, Math.PI * 2); g.fill();
  } else {
    g.fillStyle = "#b9bec5";
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#6d7279";
    g.beginPath(); g.arc(cx, cy, R * .8, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = "destination-out";
    g.beginPath(); g.arc(cx, cy, R * .7 * buka, 0, Math.PI * 2); g.fill();
  }
}

const geser = document.getElementById("waktu"), angka = document.getElementById("angka"), tombol = document.getElementById("putar");
let main = true, t0 = performance.now(), t = 0;
tombol.onclick = () => { main = !main; tombol.textContent = main ? "Jeda" : "Putar"; t0 = performance.now() - t * 1000; };
geser.oninput = () => { main = false; tombol.textContent = "Putar"; t = geser.value / 1000 * DUR; };
function loop(now) {
  if (main) { t = ((now - t0) / 1000) % DUR; geser.value = t / DUR * 1000; }
  angka.textContent = t.toFixed(1) + " s";
  for (const p of papan) gambar(p, t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
