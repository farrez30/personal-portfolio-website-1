<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader ular v6</title>
<style>
  :root { --bg:#161514; --ink:#ede8e0; --ink2:#9a948b; --line:#3a3734; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:20px 16px 48px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--ink2); margin:0 0 14px; font:13px ui-monospace, monospace; }
  .kendali { display:flex; gap:12px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 14px; }
  .kendali input { width:min(520px, 60vw); }
  button { background:var(--ink); color:var(--bg); border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .vp { position:relative; aspect-ratio:16/10; max-width:1100px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#000 url(hero-bilik.webp) center/cover; }
  .vp canvas { position:absolute; inset:0; width:100%; height:100%; }
  .fase { position:absolute; left:10px; bottom:8px; z-index:3; font:11px ui-monospace, monospace; color:var(--ink2); text-shadow:0 1px 2px #000; }
  .persen { position:absolute; left:0; right:0; bottom:7%; z-index:3; text-align:center; font:12px ui-monospace, monospace; letter-spacing:.12em; color:#9a948b; }
  .kosong { position:absolute; inset:0; display:grid; place-items:center; z-index:4; color:var(--ink2); font:13px ui-monospace, monospace; background:#0b0a09; padding:20px; text-align:center; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<h1>Kobra: berubah wujud mengagetkan, meliuk alami, mencaplok layar</h1>
<p class="sub">Model kobra Imagigoo (CC-BY), tulangnya digerakkan mengikuti jejak kepala di lintasan serpenoid.</p>
<div class="kendali">
  <button id="putar">Jeda</button>
  <button id="lambat">Lambat 0,25x</button>
  <input id="waktu" type="range" min="0" max="1000" value="0">
  <span id="angka" class="sub" style="margin:0">0.0 s</span>
</div>
<div class="vp" id="vp"><canvas id="layar"></canvas><div class="persen" id="persen"></div><div class="fase" id="fase"></div><div class="kosong" id="kosong">model belum termuat: buka lewat http (server storyboard), bukan file://</div></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const qs = new URLSearchParams(location.search);
const jepit = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const halus = (x) => x * x * (3 - 2 * x);
const halusDi = (a, b, x) => halus(jepit((x - a) / (b - a)));

// ---- Kamera dan ukuran dunia ----
const kamera = new THREE.PerspectiveCamera(40, 1.6, 0.02, 50);
kamera.position.set(0, 0, 6);
const sisiPendek = () => 2 * kamera.position.z * Math.tan(THREE.MathUtils.degToRad(kamera.fov / 2)) * Math.min(1, kamera.aspect);

// ---- Garis waktu ----
// Memuat: titik berputar di lingkaran. 100%: kilatan, kobra utuh dalam 0,2 detik, langsung jalan.
// Meliuk: lintasan kepala dihitung dari lekuk yang berayun sinus terhadap panjang busur (kurva
// serpenoid, pola gerak ular sungguhan), sambil berbelok pelan ke tengah layar. Laju tetap.
// Lalu kepala mendongak ke kamera dengan rahang terbuka, menyambar cepat, dan layar tertelan.
const MUAT = 3.4, WUJUD = 0.22, tLepas = MUAT + WUJUD;
const JARI = 0.3;
let jalurLepas = null;

function bangunJalur() {
  const Usp = sisiPendek(), R = JARI * Usp, v = R * Math.PI * 0.9, w = v / R;
  const panjangTubuh = 2 * Math.PI * R * 0.55;
  const a0 = w * tLepas;
  const titik = [new THREE.Vector3(Math.cos(a0) * R, Math.sin(a0) * R, 0)], busur = [0];
  let arah = Math.atan2(Math.cos(a0), -Math.sin(a0)); // arah singgung lingkaran
  const ds = 0.004;
  // Ayunan lekuk: amplitudo sudut A, panjang gelombang lam (satuan dunia). Lekuk maksimum
  // A*2pi/lam dijaga di bawah 1 per satuan supaya tiap ruas tubuh menekuk landai.
  const A = Number(qs.get("A") || 0.62), lam = panjangTubuh * Number(qs.get("lam") || 0.78);
  const fase = Math.acos(Math.min(1, (1 / R) / (A * 2 * Math.PI / lam)));
  const sasaran = new THREE.Vector3(0, -0.04 * Usp, 0);
  const S1 = panjangTubuh * Number(qs.get("meliuk") || 1.25), S2 = Number(qs.get("dongak") || 1.1);
  const kamZ = kamera.position.z, zUjung = kamZ - 0.32;
  let s = 0, fasaSambar = -1;
  const maju = (d) => { const p = titik.at(-1).clone().add(d.multiplyScalar(ds)); titik.push(p); s += ds; busur.push(s); };
  // 1. Meliuk di bidang layar.
  while (s < S1) {
    const p = titik.at(-1);
    const keSasaran = Math.atan2(sasaran.y - p.y, sasaran.x - p.x);
    let beda = keSasaran - arah; beda = Math.atan2(Math.sin(beda), Math.cos(beda));
    // Belok ke sasaran makin kuat kalau kepala menjauh dari tengah, supaya tetap di layar.
    const jauh = p.distanceTo(sasaran) / (0.35 * Usp);
    const belok = jepit(beda * (1.2 + jauh * 1.5), -1.4, 1.4) * halusDi(0, panjangTubuh * 0.25, s);
    const ayun = A * (2 * Math.PI / lam) * Math.cos((2 * Math.PI * s) / lam + fase);
    arah += (belok + ayun) * ds;
    maju(new THREE.Vector3(Math.cos(arah), Math.sin(arah), 0));
  }
  // 2. Mendongak: arah berpindah halus dari bidang layar ke kamera, ayunan meredup.
  const s1 = s;
  while (s < s1 + S2) {
    const u = (s - s1) / S2;
    const ayun = A * (2 * Math.PI / lam) * Math.cos((2 * Math.PI * s) / lam + fase) * (1 - u);
    arah += ayun * ds;
    const datar = new THREE.Vector3(Math.cos(arah), Math.sin(arah), 0);
    maju(datar.multiplyScalar(1 - halus(u)).add(new THREE.Vector3(0, 0.12, 1).normalize().multiplyScalar(halus(u))).normalize());
  }
  // 3. Menyambar lurus ke lensa.
  const sDongak = s, pD = titik.at(-1).clone();
  // Tulang kepala sedikit di atas tengah lensa, supaya mulut (di bawahnya) tepat di tengah layar.
  const keLensa = new THREE.Vector3(0, 0.06, zUjung).sub(pD);
  const panjangSambar = keLensa.length(); keLensa.normalize();
  while (s < sDongak + panjangSambar) maju(keLensa.clone());
  const sTotal = s;
  // Laju: tetap v sampai mulai menyambar, lalu dipercepat keras.
  const PERCEPATAN = Number(qs.get("sambar") || 70);
  const tSambar = tLepas + sDongak / v;
  const tempuhSambar = (-v + Math.sqrt(v * v + 2 * PERCEPATAN * panjangSambar)) / PERCEPATAN;
  const tTiba = tSambar + tempuhSambar;
  // Tenggorokan terbuka saat sisa jarak ke lensa tinggal sepertiga sambaran.
  const sLubang = sDongak + panjangSambar * Number(qs.get("lubang") || 0.86);
  const tauL = (-v + Math.sqrt(v * v + 2 * PERCEPATAN * (sLubang - sDongak))) / PERCEPATAN;
  jalurLepas = { R, v, w, titik, busur, sDongak, sTotal, PERCEPATAN, tSambar, tTiba, tLubang: tSambar + tauL, tDongak: tLepas + s1 / v, panjangTubuh };
}
function busurKe(s) {
  const { titik, busur } = jalurLepas;
  const i = jepit(Math.floor(s / 0.004), 0, titik.length - 2);
  const u = jepit((s - busur[i]) / Math.max(1e-9, busur[i + 1] - busur[i]));
  return titik[i].clone().lerp(titik[i + 1], u);
}
function kepala(t) {
  const { R, w, v, sDongak, sTotal, PERCEPATAN, tSambar } = jalurLepas;
  if (t <= tLepas) return new THREE.Vector3(Math.cos(w * t) * R, Math.sin(w * t) * R, 0);
  if (t <= tSambar) return busurKe(v * (t - tLepas));
  const tau = t - tSambar;
  return busurKe(Math.min(sTotal, sDongak + v * tau + 0.5 * PERCEPATAN * tau * tau));
}
const suara = (t, i) => 0.55 + 0.45 * Math.abs(Math.sin(t * 7.3 + i * 0.7) * Math.sin(t * 2.1 + i * 0.23));

// ---- Renderer di kanvas tersembunyi, digambar ke kanvas 2D supaya lubang mulut memotong keduanya ----
const layar = document.getElementById("layar");
const gl3 = document.createElement("canvas");
const renderer = new THREE.WebGLRenderer({ canvas: gl3, alpha: true, antialias: true });
renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xe9f0ff, 0x2a1d10, 0.6));
const kunci = new THREE.DirectionalLight(0xffd7a8, 3.0); kunci.position.set(1.5, 3, 5); scene.add(kunci);
const isi = new THREE.DirectionalLight(0xbfd8ff, 0.6); isi.position.set(-3, -2, 3); scene.add(isi);
const tepi = new THREE.DirectionalLight(0xffe2b8, 2.0); tepi.position.set(-2, 3, -3); scene.add(tepi);
// Cahaya kecil di depan kamera: begitu kepala mendekat, bagian dalam mulut tetap terlihat.
const mulutCahaya = new THREE.PointLight(0xffb59a, 0, 3, 2); scene.add(mulutCahaya);

// ---- Kobra ----
const RANTAI = ["BN_Head_01", "BN__Neck_02", "BN__Neck_01", "BN_Spine_03", "BN_Spine_02", "BN_Spine_01", "Hips", "BN_Tail_01", "BN_Tail_02", "BN_Tail_03", "BN_Tail_04", "BN_Tail_05", "BN_Tail_06", "BN_Tail_07"];
const ungkap = { panjang: { value: 0 }, sudut: { value: 0 }, jari: { value: 1 }, aktif: { value: 1 } };
let k = null;
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(qs.get("m") || "ular/model3.glb", (g) => {
  const akar = g.scene;
  let kulit = null;
  akar.traverse((o) => {
    if (!o.isMesh) return;
    if (o.material.name === "Material_0") o.visible = false;
    else { kulit = o; o.frustumCulled = false; }
  });
  // Berubah wujud dari kepala ke ekor: piksel tubuh yang jarak busurnya di belakang kepala lebih
  // dari batas belum muncul, dan tepi batasnya menyala biru seperti titik digital yang memadat.
  const m = kulit.material;
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uPanjang: ungkap.panjang, uSudut: ungkap.sudut, uJari: ungkap.jari, uAktif: ungkap.aktif });
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vW;")
      .replace("#include <skinning_vertex>", "#include <skinning_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vW; uniform float uPanjang, uSudut, uJari, uAktif;")
      .replace("#include <clipping_planes_fragment>", `#include <clipping_planes_fragment>
        float di = mod(uSudut - atan(vW.y, vW.x) + 6.2831853, 6.2831853) * uJari;
        float lewat = (di - uPanjang) * uAktif;
        if (lewat > 0.0) discard;`)
      .replace("#include <emissivemap_fragment>", "#include <emissivemap_fragment>\ntotalEmissiveRadiance += vec3(0.37, 0.9, 1.0) * 2.2 * uAktif * (1.0 - smoothstep(0.0, 0.18, -lewat));");
  };
  scene.add(akar);
  const tulang = kulit.skeleton.bones;
  const cari = (awal) => tulang.find((b) => b.name.startsWith(awal));
  const rantai = RANTAI.map(cari);
  const mulut = cari("BN_Mouth_01");
  kulit.skeleton.pose();
  akar.updateMatrixWorld(true);
  const ikat = rantai.map((b) => b.getWorldPosition(new THREE.Vector3()));
  const jarak = ikat.slice(1).map((p, i) => p.distanceTo(ikat[i]));
  const panjang = jarak.reduce((a, b) => a + b, 0);
  const anak = rantai.map((b) => b.children.find((c) => rantai.includes(c)) ?? null);
  const skalaIkat = rantai.map((b) => b.getWorldScale(new THREE.Vector3()));
  const iPinggul = RANTAI.indexOf("Hips");
  const tanda = rantai.map((_, i) => (i > iPinggul ? -1 : 1));
  const asal = new Map(tulang.map((b) => [b, { p: b.position.clone(), q: b.quaternion.clone(), s: b.scale.clone() }]));
  const urutan = [...rantai.keys()].sort((a, b) => kedalaman(rantai[a]) - kedalaman(rantai[b]));
  k = { akar, kulit, rantai, mulut, jarak, panjang, anak, skalaIkat, tanda, asal, urutan };
  document.getElementById("kosong").remove();
});
const kedalaman = (o) => { let d = 0; while (o.parent) { d++; o = o.parent; } return d; };

// Jejak kepala: sampel rapat ke belakang dari waktu sekarang, dengan panjang busur kumulatif.
function jejak(t, perlu) {
  const titik = [kepala(t)], busur = [0];
  for (let i = 1; i < 6000 && busur.at(-1) < perlu; i++) {
    const p = kepala(t - i * 0.003);
    busur.push(busur.at(-1) + p.distanceTo(titik.at(-1)));
    titik.push(p);
  }
  return { titik, busur };
}
function diBusur({ titik, busur }, s) {
  let lo = 0, hi = busur.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (busur[mid] < s) lo = mid; else hi = mid; }
  const u = jepit((s - busur[lo]) / Math.max(1e-9, busur[hi] - busur[lo]));
  return titik[lo].clone().lerp(titik[hi], u);
}
const sumbuY = new THREE.Vector3(0, 1, 0), m4 = new THREE.Matrix4(), mInv = new THREE.Matrix4();
function aturTulang(t, skala) {
  const { akar, rantai, jarak, panjang, anak, skalaIkat, tanda, asal, urutan } = k;
  akar.scale.setScalar(skala); akar.updateMatrixWorld(true);
  for (const [b, a] of asal) { b.position.copy(a.p); b.quaternion.copy(a.q); b.scale.copy(a.s); }
  const L = panjang * skala, j = jejak(t, L * 1.1);
  const pos = []; let s = 0;
  for (let i = 0; i < rantai.length; i++) { pos.push(diBusur(j, s)); s += (jarak[i] ?? 0) * skala; }
  const maju = new THREE.Vector3().subVectors(pos[0], diBusur(j, 0.03 * L)).normalize();
  const dunia = rantai.map((b, i) => {
    let arah;
    if (anak[i]) arah = new THREE.Vector3().subVectors(pos[rantai.indexOf(anak[i])], pos[i]).normalize();
    else if (i === 0) arah = maju.clone();
    else arah = new THREE.Vector3().subVectors(pos[i], pos[i - 1]).normalize();
    const punggung = new THREE.Vector3(0, 0, 1).lerp(new THREE.Vector3(0, 1, 0), Math.abs(arah.z)).normalize();
    punggung.sub(arah.clone().multiplyScalar(punggung.dot(arah))).normalize();
    const samping = new THREE.Vector3().crossVectors(arah, punggung).normalize();
    const pb = new THREE.Vector3(0, 0, tanda[i]);
    const sb = new THREE.Vector3().crossVectors(sumbuY, pb).normalize();
    const lokal = new THREE.Matrix4().makeBasis(sb, sumbuY, pb);
    const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(samping, arah, punggung).multiply(lokal.invert()));
    return new THREE.Matrix4().compose(pos[i], q, skalaIkat[i].clone().multiplyScalar(skala));
  });
  for (const i of urutan) {
    const b = rantai[i];
    b.parent.updateMatrixWorld(true);
    mInv.copy(b.parent.matrixWorld).invert();
    m4.multiplyMatrices(mInv, dunia[i]);
    m4.decompose(b.position, b.quaternion, b.scale);
    b.updateMatrixWorld(true);
  }
}

const keLayar = (p, W, H) => { const v = p.clone().project(kamera); return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H, v.z]; };
function gambar(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = layar.clientWidth, H = layar.clientHeight;
  // Sebelum tata letak selesai ukurannya 0: jalur yang dibangun saat itu berisi NaN.
  if (!W || !H) return;
  if (layar.width !== Math.round(W * dpr)) { layar.width = Math.round(W * dpr); layar.height = Math.round(H * dpr); jalurLepas = null; }
  kamera.aspect = W / H; kamera.updateProjectionMatrix();
  if (!jalurLepas) bangunJalur();
  renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
  const g = layar.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { tTiba, R, tLubang, tDongak, tSambar, panjangTubuh } = jalurLepas;
  const tSelesai = tTiba;
  const progres = jepit(t / MUAT);
  document.getElementById("fase").textContent = t < MUAT ? `memuat ${Math.round(progres * 100)}%` : t < tLepas ? "kilat: berubah wujud" : t < tDongak ? "meliuk" : t < tSambar ? "mendongak, rahang terbuka" : t < tSelesai ? "menyambar" : "di hero";
  document.getElementById("persen").textContent = t < MUAT ? `${Math.round(progres * 100)}%` : "";
  layar.style.display = t >= tSelesai ? "none" : "";
  if (t >= tSelesai) return;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; g.shadowBlur = 0;
  g.fillStyle = "#0b0a09"; g.fillRect(0, 0, W, H);

  // Seberapa jauh dari kepala sisik sudah muncul (satuan dunia).
  const muncul = panjangTubuh * 1.08 * jepit((t - MUAT) / WUJUD);
  // Titik digital: sepanjang jejak kepala, ikut memanjang dengan progres; yang sudah tertutup sisik hilang.
  const jt = jejak(t, panjangTubuh * 1.05);
  const panjangTitik = panjangTubuh * (0.25 + 0.75 * progres);
  const n = 46;
  for (let i = 0; i <= n; i++) {
    const s = (i / n) * panjangTitik;
    if (s < muncul) continue;
    const p = diBusur(jt, s), [x, y] = keLayar(p, W, H);
    const Ul = Math.min(W, H), amp = suara(t, i) * Ul * 0.028 * (1 - (i / n) * 0.55), lebar = Math.max(1.5, Ul * 0.007);
    g.fillStyle = i === 0 ? "#e8fbff" : `hsl(${190 - i * 1.2} 95% ${62 + (i % 3) * 6}%)`;
    g.shadowColor = "#5ee7ff"; g.shadowBlur = 10;
    g.beginPath(); g.roundRect(x - lebar / 2, y - amp - lebar / 2, lebar, amp * 2 + lebar, lebar / 2); g.fill();
  }
  g.shadowBlur = 0;

  if (!k || t < MUAT) return;
  aturTulang(t, panjangTubuh / k.panjang);
  // Ungkap hanya selama kobra masih di lingkaran; sesudah lepas seluruh tubuh sudah tampak.
  ungkap.panjang.value = muncul; ungkap.sudut.value = jalurLepas.w * t; ungkap.jari.value = R; ungkap.aktif.value = t < tLepas ? 1 : 0;
  // Mulut: mulai membuka di tengah perjalanan, terbuka lebar sebelum moncong sampai di lensa.
  // Rahang membuka saat mendongak, terbuka penuh sebelum menyambar.
  const buka = halusDi(tDongak - 0.1, tSambar, t);
  k.mulut.rotation.x += -1.1 * buka;
  const pKepala = kepala(t);
  mulutCahaya.position.set(0, 0, kamera.position.z - 0.3);
  mulutCahaya.intensity = 1.2 * halusDi(tSambar, tTiba, t);
  renderer.render(scene, kamera);
  if (gl3.width > 0 && gl3.height > 0) g.drawImage(gl3, 0, 0, W, H);
  // Kilatan saat berubah wujud: putih kebiruan, hilang dalam 0,35 detik.
  const kilat = Math.pow(1 - jepit((t - MUAT) / 0.35), 2) * (t >= MUAT ? 1 : 0);
  if (kilat > 0) { g.fillStyle = `rgba(214,246,255,${0.85 * kilat})`; g.fillRect(0, 0, W, H); }
  // Tenggorokan terbuka ke hero: setelah moncong sampai di lensa, lubang tumbuh dari pusat mulut
  // sampai menutup layar. Lubang memotong layar gelap sekaligus kepala kobra yang sudah tergambar.
  const tumbuh = jepit((t - tLubang) / Math.max(0.05, tTiba - tLubang));
  if (tumbuh > 0) {
    const pusatMulut = k.mulut.getWorldPosition(new THREE.Vector3()).lerp(k.rantai[0].getWorldPosition(new THREE.Vector3()), 0.5);
    const [mx, my] = keLayar(pusatMulut, W, H);
    // Lubang tetap di mulut; jari-jari akhirnya sepanjang diagonal, jadi layar tertutup dari titik mana pun.
    const cx = Number.isFinite(mx) ? jepit(mx, 0, W) : W / 2;
    const cy = Number.isFinite(my) ? jepit(my, 0, H) : H / 2;
    const r = Math.hypot(W, H) * 1.1 * Math.pow(tumbuh, 1.3) + 2;
    g.globalCompositeOperation = "destination-out";
    const lembut = g.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
    lembut.addColorStop(0, "rgba(0,0,0,1)"); lembut.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = lembut;
    g.beginPath(); g.ellipse(cx, cy, r, r * 0.82, 0, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = "source-over";
  }
}

const geser = document.getElementById("waktu"), angka = document.getElementById("angka"), tombol = document.getElementById("putar"), lambat = document.getElementById("lambat");
let main = true, laju = 1, t = 0, lalu = performance.now();
const DUR = () => (jalurLepas ? jalurLepas.tTiba + 2 : 9);
tombol.onclick = () => { main = !main; tombol.textContent = main ? "Jeda" : "Putar"; };
lambat.onclick = () => { laju = laju === 1 ? 0.25 : 1; lambat.textContent = laju === 1 ? "Lambat 0,25x" : "Normal 1x"; };
geser.oninput = () => { main = false; tombol.textContent = "Putar"; t = (geser.value / 1000) * DUR(); };
function lup(now) {
  const dt = (now - lalu) / 1000; lalu = now;
  if (main) { t = (t + dt * laju) % DUR(); geser.value = (t / DUR()) * 1000; }
  angka.textContent = t.toFixed(2) + " s";
  gambar(t);
  requestAnimationFrame(lup);
}
requestAnimationFrame(lup);
window.__setT = (x) => { t = x; main = false; gambar(t); };
window.__jalur = () => jalurLepas && { tDongak: jalurLepas.tDongak, tSambar: jalurLepas.tSambar, tLubang: jalurLepas.tLubang, tTiba: jalurLepas.tTiba };

</script>
