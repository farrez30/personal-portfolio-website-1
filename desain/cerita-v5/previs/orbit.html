<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { keadaanMatahari, arahMatahari, orbit, diBayangan, BATAS, BUMI } from "./matahari.js";
import { KLIEN } from "../../../content/klien.js";
import { proyek } from "../../../content/proyek.js";
import { gibs, gibsKotak, muatGambar, petaAwan, daratToon, lampuMalam, tanggalAwan } from "./lapis-nasa.js";

const R = 100, SKALA = R / BUMI.R; // 1 unit = 63,78 km
const kurangiGerak = matchMedia("(prefers-reduced-motion: reduce)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e1424);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
// kendali sendiri: geser kiri-kanan memutari benda di sekitar arah atas lokalnya, geser atas-bawah naik-turun, roda atau cubit untuk jarak
const kendali = { az: Math.PI * 0.75, el: 0.12, jarak: 6, aktif: true };
{ const titik = new Map(); let jarakCubit = 0;
  renderer.domElement.addEventListener("pointerdown", (e) => { titik.set(e.pointerId, [e.clientX, e.clientY]); renderer.domElement.setPointerCapture(e.pointerId); kendali.geser = 0; });
  renderer.domElement.addEventListener("pointermove", (e) => { if (!titik.has(e.pointerId) || !kendali.aktif) return; const [x0, y0] = titik.get(e.pointerId); titik.set(e.pointerId, [e.clientX, e.clientY]);
    if (titik.size === 2) { const [a, b] = [...titik.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (jarakCubit) kendali.jarak = Math.min(400, Math.max(0.6, kendali.jarak * (jarakCubit / d))); jarakCubit = d; return; }
    const dx = e.clientX - x0, dy = e.clientY - y0; kendali.geser += Math.abs(dx) + Math.abs(dy);
    kendali.az -= dx * 0.006; kendali.el = Math.min(1.45, Math.max(-1.2, kendali.el + dy * 0.006)); });
  const lepas = (e) => { titik.delete(e.pointerId); if (titik.size < 2) jarakCubit = 0; };
  renderer.domElement.addEventListener("pointerup", lepas); renderer.domElement.addEventListener("pointercancel", lepas);
  renderer.domElement.addEventListener("wheel", (e) => { e.preventDefault(); kendali.jarak = Math.min(400, Math.max(0.6, kendali.jarak * Math.exp(e.deltaY * 0.0012))); }, { passive: false });
  renderer.domElement.style.touchAction = "none"; }

// bintang
{ const g = new THREE.BufferGeometry(), p = []; for (let i = 0; i < 1500; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(2000 + Math.random() * 500); p.push(v.x, v.y, v.z); } g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xf6efe3, size: 1.4, sizeAttenuation: false }))); }

// tekstur siang (darat dan laut pastel) dan malam (lampu kota Black Marble) dari data/
const kanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const darat = await (await fetch("data/ne_50m_land.geojson")).json();
const siang = kanvas(4096, 2048); { const g = siang.getContext("2d"); g.fillStyle = "#a9c4ec"; g.fillRect(0, 0, 4096, 2048); g.fillStyle = "#b9dcb0";
  for (const f of darat.features) { const poli = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates; for (const pl of poli) { g.beginPath(); for (const ring of pl) ring.forEach(([lon, lat], k) => { const x = ((lon + 180) / 360) * 4096, y = ((90 - lat) / 180) * 2048; k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.fill("evenodd"); } } }
const malam = kanvas(2048, 1024); { const g = malam.getContext("2d"), img = new Image(); img.src = "data/BlackMarble_2016_01deg.jpg"; await img.decode(); g.filter = "blur(1.5px)"; g.drawImage(img, 0, 0, 2048, 1024); g.filter = "none";
  const d = g.getImageData(0, 0, 2048, 1024); for (let i = 0; i < d.data.length; i += 4) { const r = d.data[i], b = d.data[i + 2], lum = 0.3 * r + 0.59 * d.data[i + 1] + 0.11 * b, u = Math.min(1, Math.max(0, (lum - 35) / 140)), v = u * u * (3 - 2 * u) * (r > b ? 1 : 0.35); d.data[i] = 255 * v; d.data[i + 1] = 210 * v; d.data[i + 2] = 130 * v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
// lapisan NASA GIBS (bawaan; ?lapis=datar untuk versi tanpa jaringan): darat Blue Marble, awan VIIRS kemarin, lampu Black Marble
const LAPIS = new URLSearchParams(location.search).get("lapis") !== "datar";
let awanNyata = null, malamNyata = null, infoLapis = "datar";
if (LAPIS) { try { const tgl = tanggalAwan();
    const [bm, viirs, bmMalam] = await Promise.all([muatGambar(gibs("BlueMarble_NextGeneration", 4096, 2048)), muatGambar(gibs("VIIRS_NOAA20_CorrectedReflectance_TrueColor", 4096, 2048, tgl)), muatGambar(gibs("VIIRS_Black_Marble", 4096, 2048))]);
    daratToon(siang, bm); awanNyata = petaAwan(viirs, bm, 4096, 2048); malamNyata = lampuMalam(bmMalam, 4096, 2048); infoLapis = "nasa " + tgl;
    document.getElementById("kredit").textContent = "Citra: NASA GIBS, Blue Marble dan VIIRS " + tgl;
  } catch (e) { infoLapis = "gagal: " + e.message; } }
const tSiang = new THREE.CanvasTexture(siang), tMalam = new THREE.CanvasTexture(malamNyata ?? malam); tSiang.colorSpace = tMalam.colorSpace = THREE.SRGBColorSpace; tSiang.anisotropy = 8;

// bumi: darat dan laut tetap datar ala kartun, tapi peralihan siang-malam halus seperti foto orbit.
// mu = cos(zenit) = dot(normal, matahari). Terang mulai turun sebelum matahari terbenam (mu 0,6 ke 0),
// rona jingga di sekitar garis terbit, gelap penuh lewat senja nautikal (mu sekitar -0,2), lampu kota menyala bertahap.
const bahanBumi = new THREE.ShaderMaterial({
  uniforms: { tSiang: { value: tSiang }, tMalam: { value: tMalam }, matahari: { value: new THREE.Vector3(1, 0, 0) }, B: { value: new THREE.Vector4(BATAS.terbit, BATAS.sipil, BATAS.nautikal, BATAS.astronomis) }, tepi: { value: 0 } },
  vertexShader: "varying vec2 vUv; varying vec2 vG; varying vec3 vN; void main(){ vUv = uv; vec3 q = normalize(position); vG = vec2(fract(atan(q.z, -q.x) / 6.2831853 + 1.), 1. - acos(q.y) / 3.1415927); vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.); }",
  fragmentShader: `uniform sampler2D tSiang; uniform sampler2D tMalam; uniform vec3 matahari; uniform vec4 B; uniform float tepi; varying vec2 vUv; varying vec2 vG; varying vec3 vN;
    void main(){ vec3 c = texture2D(tSiang, vUv).rgb; float mu = dot(normalize(vN), normalize(matahari));
      float hari = smoothstep(-0.16, 0.06, mu);
      vec3 siangW = c * (0.58 + 0.42 * smoothstep(-0.02, 0.6, mu));
      siangW = mix(siangW, siangW * vec3(1.08, 0.72, 0.52), 0.55 * exp(-pow((mu - 0.01) / 0.075, 2.)));
      vec3 w = mix(c * vec3(0.012, 0.016, 0.035), siangW, hari);
      w += texture2D(tMalam, vG).rgb * (1. - smoothstep(-0.2, 0.03, mu)) * 1.6;
      float pinggir = tepi > 0. ? smoothstep(0., tepi, min(min(vUv.x, 1. - vUv.x), min(vUv.y, 1. - vUv.y))) : 1.;
      gl_FragColor = vec4(w, pinggir);
#include <colorspace_fragment>
    }`,
});
const bumi = new THREE.Mesh(new THREE.SphereGeometry(R, 160, 120), bahanBumi); scene.add(bumi);
// garis pantai sebagai garis vektor di permukaan, tetap tajam di jarak berapa pun (tekstur hanya mengisi warna darat)
const garisPantai = () => { const p = [], titik = (lon, lat) => { const fi = ((lon + 180) / 360) * Math.PI * 2, th = ((90 - lat) * Math.PI) / 180, r = R * 1.0008; return [-Math.cos(fi) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(fi) * Math.sin(th) * r]; };
  for (const f of darat.features) { const poli = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates; for (const pl of poli) for (const ring of pl) for (let k = 1; k < ring.length; k++) { if (Math.abs(ring[k][0] - ring[k - 1][0]) > 180) continue; p.push(...titik(...ring[k - 1]), ...titik(...ring[k])); } }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  // memudar saat dilihat menyamping (di cakrawala segmennya terpotong lengkung bola) dan saat tertutup awan
  bumi.add(new THREE.LineSegments(g, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { tAwan: { value: tAwan }, matahari: bahanBumi.uniforms.matahari },
    vertexShader: "varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vec3 q = normalize(position); vUv = vec2(fract(atan(q.z, -q.x) / 6.2831853 + 1.), 1. - acos(q.y) / 3.1415927); vec4 w = modelMatrix * vec4(position, 1.); vN = normalize(w.xyz); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }",
    fragmentShader: "uniform sampler2D tAwan; uniform vec3 matahari; varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ float tegak = smoothstep(0.12, 0.4, dot(vN, vV)); float awan = texture2D(tAwan, vUv).a; float hari = smoothstep(-0.16, 0.06, dot(vN, normalize(matahari))); gl_FragColor = vec4(vec3(0.16, 0.16, 0.21), 0.75 * tegak * (1. - 0.85 * awan) * (0.35 + 0.65 * hari)); }" }))); };
// atmosfer: satu cangkang. Untuk sinar pandang yang lewat di atas bumi, makin dekat ke permukaan makin terang;
// untuk sinar yang mengenai bumi, makin panjang jalannya di udara makin berkabut. Keduanya bertemu mulus di tepi bumi.
const atmosfer = new THREE.Mesh(new THREE.SphereGeometry(R * 1.025, 96, 72), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { matahari: bahanBumi.uniforms.matahari, R: { value: R }, Ra: { value: R * 1.025 } },
  vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 p = modelMatrix * vec4(position,1.); vV = normalize(cameraPosition - p.xyz); gl_Position = projectionMatrix * viewMatrix * p; }",
  fragmentShader: `uniform vec3 matahari; uniform float R; uniform float Ra; varying vec3 vN; varying vec3 vV;
    void main(){ vec3 ro = cameraPosition, rd = -vV; float tc = -dot(ro, rd); vec3 pc = ro + rd * tc; float d = length(pc), a; vec3 titik;
      if (d >= R) { a = pow(1. - clamp((d - R) / (Ra - R), 0., 1.), 2.2); titik = pc; }
      else { float tHit = tc - sqrt(R * R - d * d), tIn = tc - sqrt(max(Ra * Ra - d * d, 0.)); a = pow(clamp((tHit - tIn) / sqrt(Ra * Ra - R * R), 0., 1.), 3.); titik = ro + rd * tHit; }
      float mu = dot(normalize(titik), normalize(matahari)), terang = smoothstep(-0.22, 0.12, mu);
      vec3 w = mix(vec3(0.2, 0.24, 0.45), vec3(0.6, 0.78, 1.), terang); w = mix(w, vec3(1., 0.62, 0.45), 0.5 * exp(-pow((mu - 0.02) / 0.09, 2.)));
      gl_FragColor = vec4(w, 0.7 * a * (0.08 + 0.92 * terang)); }` }));
scene.add(atmosfer);
const awanKanvas = awanNyata ?? kanvas(2048, 1024); if (!awanNyata) { const g = awanKanvas.getContext("2d"); let benih = 7; const acak = () => ((benih = (benih * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 260; i++) { const x = acak() * 2048, y = 160 + acak() * 704, r = 3 + acak() * 11, n = 2 + Math.floor(acak() * 4); g.fillStyle = "rgba(255,255,255,0.85)"; for (let k = 0; k < n; k++) { g.beginPath(); g.arc(x + (acak() - 0.5) * r * 3, y + (acak() - 0.5) * r, r * (0.6 + acak() * 0.6), 0, 7); g.fill(); } } }
const tAwan = new THREE.CanvasTexture(awanKanvas); tAwan.colorSpace = THREE.SRGBColorSpace;
const awan = new THREE.Mesh(new THREE.SphereGeometry(R * 1.004, 128, 96), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { tAwan: { value: tAwan }, matahari: bahanBumi.uniforms.matahari },
  vertexShader: "varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.); }",
  fragmentShader: "uniform sampler2D tAwan; uniform vec3 matahari; varying vec2 vUv; varying vec3 vN; void main(){ float a = texture2D(tAwan, vUv).a; float mu = dot(normalize(vN), normalize(matahari)); float hari = smoothstep(-0.16, 0.06, mu); vec3 w = vec3(0.97, 0.96, 0.94) * (0.6 + 0.4 * smoothstep(-0.02, 0.6, mu)); w = mix(w, w * vec3(1.05, 0.75, 0.6), 0.5 * exp(-pow((mu - 0.01) / 0.075, 2.))); gl_FragColor = vec4(mix(vec3(0.12, 0.14, 0.22), w, hari), a * mix(0.06, 0.92, hari)); }" }));
scene.add(awan);
garisPantai();
