<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit stasiun dan satelit klien</title>
<style>
  :root { color-scheme: dark; --tinta: #2a2836; --kertas: #f6efe3; --merah: #e0574b; }
  html, body { margin: 0; height: 100%; background: #0e1424; color: var(--kertas); font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: fixed; z-index: 5; background: rgba(246, 239, 227, 0.96); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; }
  .jam { left: 16px; top: 16px; padding: 10px 14px; font: 600 14px/1.5 ui-monospace, monospace; }
  .jam b { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--merah); color: #fff; margin-left: 4px; }
  .jam button, .daftar button, .hud a, .bawah button { font: 600 14px system-ui; border: 2px solid var(--tinta); border-radius: 6px; background: var(--kertas); color: var(--tinta); padding: 6px 10px; cursor: pointer; min-height: 36px; }
  .jam button[aria-pressed="true"], .bawah button[aria-pressed="true"] { background: var(--tinta); color: var(--kertas); }
  .jam .tombol { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .daftar { right: 16px; top: 16px; bottom: 16px; width: 230px; padding: 10px; overflow-y: auto; }
  .daftar h2 { font: 700 13px ui-monospace, monospace; letter-spacing: .06em; margin: 4px 0 8px; }
  .daftar ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .daftar button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; }
  .daftar button[aria-current="true"] { background: var(--merah); color: #fff; }
  .titik { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--tinta); flex: none; }
  .hud { position: fixed; z-index: 4; width: 260px; padding: 12px 14px; pointer-events: auto; }
  .hud h3 { margin: 0 0 2px; font-size: 18px; }
  .hud .kode { font: 600 12px ui-monospace, monospace; letter-spacing: .05em; color: #6b6375; }
  .hud p { margin: 8px 0; font-size: 14px; line-height: 1.45; }
  .hud a { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; }
  svg.garis { position: fixed; inset: 0; z-index: 3; pointer-events: none; width: 100%; height: 100%; }
  .bawah { left: 16px; bottom: 16px; padding: 8px; display: flex; gap: 6px; }
  .jendela { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none; }
  .jendela.nyala { display: block; }
  @media (max-width: 720px) { .daftar { top: auto; bottom: 70px; left: 16px; right: 16px; width: auto; height: 120px; } .hud { width: calc(100% - 64px); } }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.187.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/" } }</script>
</head>
<body>
<div class="panel jam" aria-live="polite">
  <div id="jamSim">-</div>
  <div id="jamNyata">-</div>
  <div class="tombol">
    <button id="mNyata" aria-pressed="false">Waktu nyata</button>
    <button id="mCepat" aria-pressed="true">Detik ini, 60x</button>
  </div>
</div>
<nav class="panel daftar" aria-label="Satelit">
  <h2>MONITOR SATELIT</h2>
  <ol id="daftar"></ol>
</nav>
<div class="panel bawah">
  <button id="vLuar" aria-pressed="true">Dari luar</button>
  <button id="vJendela" aria-pressed="false">Jendela kokpit</button>
</div>
<svg class="garis" aria-hidden="true"><polyline id="garis" fill="none" stroke="#f6efe3" stroke-width="2" points=""/></svg>
<aside class="panel hud" id="hud" hidden></aside>
<svg class="jendela" id="jendela" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><mask id="lubang"><rect width="1000" height="1000" fill="#fff"/>
    <circle cx="500" cy="560" r="150" fill="#000"/>
    <polygon points="372,442 230,300 410,190 470,390" fill="#000"/><polygon points="628,442 770,300 590,190 530,390" fill="#000"/>
    <polygon points="350,600 150,640 170,860 360,710" fill="#000"/><polygon points="650,600 850,640 830,860 640,710" fill="#000"/>
    <polygon points="440,720 380,920 620,920 560,720" fill="#000"/><polygon points="430,370 460,150 540,150 570,370" fill="#000"/>
  </mask></defs>
  <rect id="dinding" width="1000" height="1000" fill="#3a3544" mask="url(#lubang)"/>
  <g fill="none" stroke="#2a2836" stroke-width="10">
    <circle cx="500" cy="560" r="150"/><polygon points="372,442 230,300 410,190 470,390"/><polygon points="628,442 770,300 590,190 530,390"/>
    <polygon points="350,600 150,640 170,860 360,710"/><polygon points="650,600 850,640 830,860 640,710"/><polygon points="440,720 380,920 620,920 560,720"/><polygon points="430,370 460,150 540,150 570,370"/>
  </g>
  <rect id="sinar" width="1000" height="1000" fill="#ffe9b8" opacity="0" mask="url(#lubang)"/>
</svg>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { keadaanMatahari, arahMatahari, orbit, diBayangan, BATAS, BUMI } from "./matahari.js";
import { KLIEN } from "../../../content/klien.js";
import { proyek } from "../../../content/proyek.js";

const R = 100, SKALA = R / BUMI.R; // 1 unit = 63,78 km
const kurangiGerak = matchMedia("(prefers-reduced-motion: reduce)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e1424);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
const kendali = new OrbitControls(cam, renderer.domElement); kendali.enableDamping = true; kendali.minDistance = 0.6; kendali.maxDistance = 900;

// bintang
{ const g = new THREE.BufferGeometry(), p = []; for (let i = 0; i < 1500; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(2000 + Math.random() * 500); p.push(v.x, v.y, v.z); } g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xf6efe3, size: 1.4, sizeAttenuation: false }))); }

// tekstur siang (darat dan laut pastel) dan malam (lampu kota Black Marble) dari data/
const kanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const darat = await (await fetch("data/ne_50m_land.geojson")).json();
const siang = kanvas(4096, 2048); { const g = siang.getContext("2d"); g.fillStyle = "#a9c4ec"; g.fillRect(0, 0, 4096, 2048); g.fillStyle = "#b9dcb0"; g.strokeStyle = "#2a2836"; g.lineWidth = 2.5;
  for (const f of darat.features) { const poli = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates; for (const pl of poli) { g.beginPath(); for (const ring of pl) ring.forEach(([lon, lat], k) => { const x = ((lon + 180) / 360) * 4096, y = ((90 - lat) / 180) * 2048; k ? g.lineTo(x, y) : g.moveTo(x, y); }); g.fill("evenodd"); g.stroke(); } } }
const malam = kanvas(2048, 1024); { const g = malam.getContext("2d"), img = new Image(); img.src = "data/BlackMarble_2016_01deg.jpg"; await img.decode(); g.drawImage(img, 0, 0, 2048, 1024);
  const d = g.getImageData(0, 0, 2048, 1024); for (let i = 0; i < d.data.length; i += 4) { const r = d.data[i], b = d.data[i + 2], lum = 0.3 * r + 0.59 * d.data[i + 1] + 0.11 * b, nyala = lum > 70 && r > b; d.data[i] = nyala ? 255 : 0; d.data[i + 1] = nyala ? 217 : 0; d.data[i + 2] = nyala ? 138 : 0; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
const tSiang = new THREE.CanvasTexture(siang), tMalam = new THREE.CanvasTexture(malam); tSiang.colorSpace = tMalam.colorSpace = THREE.SRGBColorSpace; tSiang.anisotropy = 8;

// bumi toon: anak tangga terang dari cos(zenit) = dot(normal, matahari); batas USNO (terbit, senja sipil, nautikal, astronomis)
const bahanBumi = new THREE.ShaderMaterial({
  uniforms: { tSiang: { value: tSiang }, tMalam: { value: tMalam }, matahari: { value: new THREE.Vector3(1, 0, 0) }, B: { value: new THREE.Vector4(BATAS.terbit, BATAS.sipil, BATAS.nautikal, BATAS.astronomis) } },
  vertexShader: "varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.); }",
  fragmentShader: `uniform sampler2D tSiang; uniform sampler2D tMalam; uniform vec3 matahari; uniform vec4 B; varying vec2 vUv; varying vec3 vN;
    void main(){ vec3 c = texture2D(tSiang, vUv).rgb; float mu = dot(normalize(vN), normalize(matahari));
      vec3 malamWarna = c * vec3(0.26, 0.28, 0.42);
      vec3 w = mu > B.x ? c : mu > B.y ? mix(c, vec3(0.95, 0.66, 0.55), 0.55) * 0.82 : mu > B.z ? mix(malamWarna, vec3(0.55, 0.38, 0.5), 0.35) : mu > B.w ? malamWarna * 1.08 : malamWarna;
      if (mu < B.y) w += texture2D(tMalam, vUv).rgb * 0.9;
      float garis = abs(mu - B.x) / fwidth(mu); if (garis < 1.2) w = vec3(0.16, 0.16, 0.21);
      gl_FragColor = vec4(w, 1.);
#include <colorspace_fragment>
    }`,
});
const bumi = new THREE.Mesh(new THREE.SphereGeometry(R, 160, 120), bahanBumi); scene.add(bumi);
const atmosfer = new THREE.Mesh(new THREE.SphereGeometry(R * 1.025, 64, 48), new THREE.ShaderMaterial({ side: THREE.BackSide, transparent: true, depthWrite: false, uniforms: { matahari: bahanBumi.uniforms.matahari },
  vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 p = modelMatrix * vec4(position,1.); vV = normalize(cameraPosition - p.xyz); gl_Position = projectionMatrix * viewMatrix * p; }",
  fragmentShader: "uniform vec3 matahari; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1. - abs(dot(vV, -vN)), 2.); float terang = step(-0.1, dot(-vN, normalize(matahari))); float a = f > 0.55 ? 0.55 : f > 0.3 ? 0.25 : 0.; gl_FragColor = vec4(mix(vec3(0.35,0.4,0.7), vec3(0.66,0.8,1.), terang), a * (0.35 + 0.65 * terang)); }" }));
scene.add(atmosfer);
const sinarMatahari = new THREE.DirectionalLight(0xfff1dc, 2.2); scene.add(sinarMatahari); scene.add(new THREE.AmbientLight(0x8899cc, 0.35));
const piringan = new THREE.Mesh(new THREE.CircleGeometry(18, 32), new THREE.MeshBasicMaterial({ color: 0xfff6d8 })); scene.add(piringan);

// benda: stasiun kita (2 modul + node) dan satelit klien
const toon = (c) => new THREE.MeshToonMaterial({ color: c });
const bendaStasiun = () => { const g = new THREE.Group();
  for (const [x, c] of [[-0.55, 0xe0574b], [0.55, 0xa9c4ec]]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.75, 20), toon(0xeae6dc)); m.rotation.z = Math.PI / 2; m.position.x = x; g.add(m); const r = new THREE.Mesh(new THREE.TorusGeometry(0.205, 0.02, 6, 24), toon(c)); r.rotation.y = Math.PI / 2; r.position.x = x; g.add(r); }
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), toon(0xd9d2c6)));
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.01, 0.9), toon(0x4b5f9e)); p.position.set(s * 1.25, 0, 0); g.add(p); }
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.6, 6), toon(0x847e75)); t.rotation.z = Math.PI / 2; g.add(t); return g; };
const bendaSatelit = (warna) => { const g = new THREE.Group(); g.add(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), toon(warna)));
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.008, 0.12), toon(0x4b5f9e)); p.position.x = s * 0.24; g.add(p); } const a = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.08, 10), toon(0xd9d2c6)); a.position.y = 0.11; g.add(a); return g; };
const WARNA = { coderoach: 0xb9dcb0, mitraplus: 0xa9c4ec, pribadi: 0xf2d27a };
const KEL = { coderoach: { raan: 30, i: 45, nama: "Coderoach" }, mitraplus: { raan: 150, i: 97.6, nama: "Mitraplus" }, pribadi: { raan: 270, i: 28, nama: "Personal" } };
const titikSprite = (warna) => { const c = kanvas(32, 32), g = c.getContext("2d"); g.fillStyle = "#" + warna.toString(16).padStart(6, "0"); g.strokeStyle = "#2a2836"; g.lineWidth = 5; g.beginPath(); g.arc(16, 16, 11, 0, 7); g.fill(); g.stroke();
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), sizeAttenuation: false, depthTest: true })); s.scale.setScalar(0.022); return s; };

const benda = [];
const stasiun = { id: "stasiun", nama: "Stasiun kita", obj: bendaStasiun(), orbit: orbit({ tinggi: 420 }), warna: 0xe0574b };
benda.push(stasiun);
const perKel = {}; KLIEN.forEach((k) => (perKel[k.kelompok] = (perKel[k.kelompok] ?? 0) + 1));
const ke = {}; KLIEN.forEach((k) => { const j = (ke[k.kelompok] = (ke[k.kelompok] ?? -1) + 1), n = perKel[k.kelompok], g = KEL[k.kelompok];
  benda.push({ id: k.slug, data: k, nama: k.nama, warna: WARNA[k.kelompok], obj: bendaSatelit(WARNA[k.kelompok]),
    orbit: orbit({ tinggi: 520 + (j % 4) * 60, inklinasi: g.i + (j % 3) * 2, raan0: g.raan + (j * 360) / n / 3, u0: (j * 360) / n }) }); });
for (const b of benda) { b.obj.add((b.titik = titikSprite(b.warna))); b.titik.position.set(0, 0, 0); const kena = new THREE.Mesh(new THREE.SphereGeometry(b === stasiun ? 1.2 : 0.8, 8, 6), new THREE.MeshBasicMaterial({ visible: false })); kena.userData.b = b; b.obj.add(kena); b.kena = kena; scene.add(b.obj); }

// waktu: "detik ini, 60x" mulai dari keadaan nyata lalu dipercepat; "waktu nyata" selalu Date.now()
let mode = kurangiGerak ? "nyata" : "cepat", jangkarNyata = Date.now(), jangkarSim = Date.now();
const waktu = () => (mode === "nyata" ? Date.now() : jangkarSim + (Date.now() - jangkarNyata) * 60);
const setMode = (m) => { jangkarSim = waktu(); jangkarNyata = Date.now(); if (m === "nyata") jangkarSim = Date.now(); mode = m; mNyata.setAttribute("aria-pressed", m === "nyata"); mCepat.setAttribute("aria-pressed", m === "cepat"); };
mNyata.onclick = () => setMode("nyata"); mCepat.onclick = () => { jangkarSim = Date.now(); jangkarNyata = Date.now(); mode = "cepat"; mNyata.setAttribute("aria-pressed", false); mCepat.setAttribute("aria-pressed", true); };
setMode(mode);

// fokus: kamera mengikuti satu benda sebagai pusat putaran 360
let fokus = stasiun, terbang = null, pandang = "luar";
const posDunia = (b) => b.obj.getWorldPosition(new THREE.Vector3());
const pilih = (b) => { const awal = cam.position.clone(), awalKe = kendali.target.clone(), arah = cam.position.clone().sub(kendali.target).normalize(), jarak = b === stasiun ? 5 : 2.2; terbang = { b, awal, awalKe, arah, jarak, t0: performance.now() }; fokus = b; tampilHud(b); tandaiDaftar(b); };
const daftar = document.getElementById("daftar");
for (const b of benda) { const li = document.createElement("li"), t = document.createElement("button"); t.innerHTML = `<span class="titik" style="background:#${b.warna.toString(16).padStart(6, "0")}"></span>${b.nama}`; t.onclick = () => pilih(b); b.tombol = t; li.append(t); daftar.append(li); }
const tandaiDaftar = (b) => benda.forEach((x) => x.tombol.setAttribute("aria-current", x === b));
const hud = document.getElementById("hud"), garis = document.getElementById("garis");
const ikonKeluar = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2H2v10h10V9M8 2h4v4M12 2 6 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function tampilHud(b) {
  if (b === stasiun) { hud.innerHTML = `<div class="kode">STASIUN HUB</div><h3>Stasiun kita</h3><p>2 modul lab, 1 node, 2 port kosong. Orbit tipe ISS, 420 km.</p>`; }
  else { const k = b.data, tahun = (k.kerja.id.match(/(19|20)\d\d/) ?? [null])[0], p = proyek.find((x) => x.slug === k.slug), tautan = p?.tautan?.situs ?? k.tautan ?? p?.tautan?.kasus; // situs asli dulu, lalu halaman kasus
    hud.innerHTML = `<div class="kode">${KEL[k.kelompok].nama.toUpperCase()}${tahun ? ", SEJAK " + tahun : ""}</div><h3>${k.nama}</h3><p>${k.industri.id}. ${k.kerja.id}</p>${tautan ? `<a href="${tautan}" target="_blank" rel="noopener noreferrer" aria-label="Buka situs ${k.nama} di tab baru">Buka situs ${ikonKeluar}</a>` : ""}`; }
  hud.hidden = false;
}
renderer.domElement.addEventListener("click", (e) => { const r = new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), cam);
  const h = r.intersectObjects(benda.map((b) => b.kena), false)[0]; if (h) pilih(h.object.userData.b); });

// tampilan: dari luar (OrbitControls di sekitar fokus) atau jendela kokpit (kamera di stasiun menghadap cakrawala)
const setPandang = (p) => { pandang = p; vLuar.setAttribute("aria-pressed", p === "luar"); vJendela.setAttribute("aria-pressed", p === "jendela"); document.getElementById("jendela").classList.toggle("nyala", p === "jendela"); kendali.enabled = p === "luar"; stasiun.obj.visible = p === "luar"; // dari dalam kokpit, badan stasiun sendiri tidak terlihat if (p === "jendela") { fokus = stasiun; hud.hidden = true; garis.setAttribute("points", ""); } else pilih(stasiun); };
vLuar.onclick = () => setPandang("luar"); vJendela.onclick = () => setPandang("jendela");

const fmt = (ms, zona) => new Date(ms).toLocaleString("id-ID", { timeZone: zona, hour: "2-digit", minute: "2-digit", second: "2-digit", day: "numeric", month: "short", year: "numeric" });
let terakhirPos = null;
function langkah() {
  const ms = waktu(), m = keadaanMatahari(ms), s = new THREE.Vector3(...arahMatahari(ms));
  bumi.rotation.y = (m.gmst * Math.PI) / 180; atmosfer.rotation.y = bumi.rotation.y;
  bahanBumi.uniforms.matahari.value.copy(s); sinarMatahari.position.copy(s).multiplyScalar(1000); piringan.position.copy(s).multiplyScalar(2200); piringan.lookAt(0, 0, 0);
  for (const b of benda) { const p = b.orbit.posisi(ms), q = b.orbit.posisi(ms + 1000); b.obj.position.set(p[0], p[1], p[2]).multiplyScalar(SKALA); b.obj.lookAt(q[0] * SKALA, q[1] * SKALA, q[2] * SKALA); b.gelap = diBayangan(p, [s.x, s.y, s.z]); }
  const pf = posDunia(fokus);
  if (pandang === "luar") {
    if (terbang) { const u = Math.min(1, (performance.now() - terbang.t0) / (kurangiGerak ? 1 : 1300)), e = u * u * (3 - 2 * u), tuju = pf.clone().addScaledVector(terbang.arah, terbang.jarak);
      cam.position.copy(terbang.awal).lerp(tuju, e); kendali.target.copy(terbang.awalKe).lerp(pf, e); if (u >= 1) terbang = null; }
    else if (terakhirPos) { const d = pf.clone().sub(terakhirPos); cam.position.add(d); kendali.target.add(d); }
    kendali.update();
  } else {
    // dari kokpit: kamera di stasiun, menghadap ke depan orbit dan sedikit ke bawah cakrawala
    const q = stasiun.orbit.posisi(ms + 20000), maju = new THREE.Vector3(q[0], q[1], q[2]).multiplyScalar(SKALA).sub(pf).normalize(), atas = pf.clone().normalize();
    cam.position.copy(pf).addScaledVector(atas, 0.3); cam.up.copy(atas); cam.lookAt(pf.clone().addScaledVector(maju, 10).addScaledVector(atas, -3.2));
    document.getElementById("sinar").setAttribute("opacity", stasiun.gelap ? 0 : 0.18);
    document.getElementById("dinding").setAttribute("fill", stasiun.gelap ? "#2a2534" : "#6f6476");
  }
  terakhirPos = pf.clone();
  // HUD: garis dari benda ke panel
  if (!hud.hidden && pandang === "luar") { const v = pf.clone().project(cam), x = ((v.x + 1) / 2) * innerWidth, y = ((1 - v.y) / 2) * innerHeight, hx = Math.min(innerWidth - 520, x + 90), hy = Math.max(16, y - 160);
    hud.style.left = hx + "px"; hud.style.top = hy + "px"; garis.setAttribute("points", v.z < 1 ? `${x},${y} ${x + 40},${hy + 30} ${hx},${hy + 30}` : ""); }
  jamSim.innerHTML = (mode === "cepat" ? "Simulasi " : "Sekarang ") + fmt(ms, "UTC") + " UTC" + (mode === "cepat" ? "<b>60x</b>" : "");
  jamNyata.textContent = "Jam Anda " + fmt(Date.now(), undefined);
  renderer.render(scene, cam);
  window.__keadaan = { ms, subsolar: [m.lintangSubsolar, m.bujurSubsolar], stasiunGelap: stasiun.gelap, fokus: fokus.id, mode, pandang };
}
cam.position.set(260, 120, 260); kendali.target.set(0, 0, 0);
pilih(stasiun);
window.__langkah = langkah; window.__pilih = (id) => pilih(benda.find((b) => b.id === id)); window.__setPandang = setPandang; window.__setMode = setMode;
renderer.setAnimationLoop(langkah);
