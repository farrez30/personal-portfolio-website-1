<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previs cerita v5</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .teks { position: fixed; left: 6vw; top: 50%; transform: translateY(-50%); max-width: 30vw; color: #ece8e1; }
  .teks .lbl { font: 12px ui-monospace, monospace; letter-spacing: .08em; color: #f0b35a; }
  .teks h1 { font-size: clamp(26px, 3.2vw, 46px); line-height: 1.1; margin: 10px 0 0; font-weight: 600; letter-spacing: -.01em; }
  .hp .teks { left: 20px; right: 20px; top: auto; bottom: 34px; transform: none; max-width: none; }
  .hp .teks h1 { font-size: 26px; }
  .bayang { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(26,20,16,.82), rgba(26,20,16,0) 45%); }
  .hp .bayang { background: linear-gradient(0deg, rgba(26,20,16,.9), rgba(26,20,16,0) 40%); }
  .terang .teks { color: #2a2420; } .terang .teks .lbl { color: #b3322a; } .terang .cap { color: #6f695f; }
  .terang .bayang { background: linear-gradient(90deg, rgba(243,236,224,.85), rgba(243,236,224,0) 45%); }
  .terang.hp .bayang { background: linear-gradient(0deg, rgba(243,236,224,.92), rgba(243,236,224,0) 40%); }
  .malam .bayang { background: linear-gradient(90deg, rgba(31,36,64,.85), rgba(31,36,64,0) 45%); }
  .malam.hp .bayang { background: linear-gradient(0deg, rgba(31,36,64,.92), rgba(31,36,64,0) 40%); }
  .cap { position: fixed; right: 14px; top: 12px; font: 10px ui-monospace, monospace; color: #847e75; letter-spacing: .08em; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.187.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/" } }</script>
</head>
<body>
<div class="bayang"></div>
<div class="teks"><div class="lbl" id="lbl"></div><h1 id="judul"></h1></div>
<div class="cap">PREVIS BLOCKOUT</div>
<script type="module">
import * as THREE from "three";
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";
import { ARAH } from "./shot.mjs";
import { PULAU, KOTA } from "../peta.mjs";

const q = new URLSearchParams(location.search);
const daftar = ARAH[q.get("a") ?? "G"];
const shot = daftar.find((s) => s.id === q.get("s")) ?? daftar[0];
const HP = innerWidth < 768;
const GAYA = q.get("gaya") ?? "clay"; // clay | toon | iso | lowpoly
const TERANG = GAYA !== "clay";
document.body.classList.toggle("terang", TERANG);
document.body.classList.toggle("hp", HP);
document.getElementById("lbl").textContent = `${shot.label}  SKALA ${shot.skala}`;
document.getElementById("judul").textContent = shot.judul;
document.querySelector(".cap").textContent = `PREVIS ${GAYA.toUpperCase()}`;

const INK = 0xece8e1, RED = 0xe0574b, AMB = 0xf0b35a, BG = 0x1a1410;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(q.get("dpr") ? Number(q.get("dpr")) : 1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = TERANG ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

let scene = new THREE.Scene();
const LATAR = TERANG ? 0xf3ece0 : BG;
scene.background = new THREE.Color(LATAR);
const cam = new THREE.PerspectiveCamera(HP ? 52 : 38, innerWidth / innerHeight, 0.01, 5e6);

// ---------- bahan dan benda dasar ----------
const ramp = (() => { const d = new Uint8Array([150, 212, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
// warna clay dipetakan ke palet pastel: dicampur krem lalu diangkat, merah dan kuning tetap jadi aksen
const pastel = (c) => { const a = new THREE.Color(c), k = new THREE.Color(0xf6efe2); const hsl = {}; a.getHSL(hsl); if (hsl.s > 0.45) return a.lerp(k, 0.12); return a.lerp(k, 0.45).offsetHSL(0, 0.06, 0.04); };
// palet pastel per jenis benda (gaya kartun), mengikuti designed-to-scale: krem, kuning, biru, hijau, ungu, aksen merah
const PALET = { 0xb8b0a4: 0xf6efe3, 0x4a433c: 0x4b4a5c, 0x2a2420: 0xefe6d4, 0x3a322b: 0xeadfca, 0x9c8a74: 0xf2d49b, 0xa89c8c: 0xa9c4ec, 0x8c7f70: 0xb9dcb0,
  0xd9d2c6: 0xfffaf0, 0xc9a25a: 0xf6c76b, 0x7d8a6a: 0xb9dcb0, 0x6e665d: 0xcdb8e8, 0x8f857a: 0xf2b8a0, 0x6f665c: 0xa9c4ec, 0x847e75: 0x9a93a8,
  0x7a7066: 0xb9dcb0, 0x5a524a: 0xb9dcb0, 0x221c17: 0xa9c4ec, 0x8c8478: 0xd8cdbb, 0x8a9ab8: 0xa9c4ec };
const tekstur = (w, h, gambar) => { const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d"); gambar(g, w, h); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const titikKertas = (() => { const t = tekstur(64, 64, (g, w, h) => { g.fillStyle = "#efe6d4"; g.fillRect(0, 0, w, h); g.fillStyle = "#d6c9b2"; g.beginPath(); g.arc(32, 32, 3, 0, 7); g.fill(); }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); return t; });
const clay = (c = 0xb8b0a4, o = {}) => {
  if (GAYA === "clay") return new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...o });
  const warna = new THREE.Color(PALET[c] ?? pastel(c)), map = c === 0x2a2420 ? titikKertas() : null, emissive = o.emissive ? pastel(o.emissive) : undefined;
  if (GAYA === "lowpoly") return new THREE.MeshLambertMaterial({ color: map ? 0xffffff : warna, map, flatShading: true, emissive, emissiveIntensity: (o.emissiveIntensity ?? 0) * 0.5 });
  return new THREE.MeshToonMaterial({ color: map ? 0xffffff : warna, map, gradientMap: ramp, emissive, emissiveIntensity: (o.emissiveIntensity ?? 0) * 0.5 });
};
const tanpaGaris = (m) => { m.userData.outlineParameters = { visible: false }; return m; };
const M = { clay: clay(), gelap: clay(0x4a433c), lantai: clay(0x2a2420), merah: clay(RED, { emissive: RED, emissiveIntensity: 0.25 }), kuning: clay(0xc9a25a, { metalness: 0.6, roughness: 0.35 }) };
const kotak = (w, h, d, m = M.clay, x = 0, y = 0, z = 0, par = scene) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; par.add(o); return o; };
const silinder = (r, h, m = M.clay, x = 0, y = 0, z = 0, par = scene, seg = 32) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; par.add(o); return o; };
const layar = (w, h, gambar, terang = 1) => new THREE.MeshBasicMaterial({ map: tekstur(w, h, gambar), color: new THREE.Color(terang, terang, terang) });
const label = (teks, x, y, z, s = 0.1, warna = "#ece8e1", par = scene) => {
  if (TERANG && warna === "#ece8e1") warna = "#2a2420"; if (TERANG && warna === "#f0b35a") warna = "#a8641a";
  const map = tekstur(512, 128, (g, w, h) => { g.font = "600 64px ui-monospace, monospace"; g.fillStyle = warna; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(teks, w / 2, h / 2); });
  const sp = new THREE.Sprite(tanpaGaris(new THREE.SpriteMaterial({ map, transparent: true, depthTest: false })));
  sp.scale.set(s * 4, s, 1); sp.position.set(x, y, z); sp.renderOrder = 9; par.add(sp); return sp;
};
const lampuDasar = (kunci = 1.6, isi = 0.35) => {
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x201812, isi));
  const d = new THREE.DirectionalLight(0xffe7c2, kunci);
  d.position.set(-1.6, 3, 1.8); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  Object.assign(d.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.1, far: 10 }); d.shadow.bias = -0.0004; d.shadow.normalBias = TERANG ? 0.012 : 0;
  scene.add(d); return d;
};
let sasaran = new THREE.Vector3();
const lihat = (pos, ke) => { cam.position.set(...pos); sasaran = new THREE.Vector3(...ke); cam.lookAt(sasaran); };
addEventListener("error", (e) => { window.GALAT = String(e.message); });


const ambilData = async () => {
  if (window.__peta) return window.__peta;
  const [darat, kotaDunia, malam] = await Promise.all([
    fetch("data/ne_50m_land.geojson").then((r) => r.json()),
    fetch("data/ne_50m_populated_places_simple.geojson").then((r) => r.json()),
    new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = "data/BlackMarble_2016_01deg.jpg"; }),
  ]);
  return (window.__peta = { darat, kotaDunia, malam });
};
// gambar daratan di kotak bujur/lintang [lon0, lon1, lat0, lat1] ke kanvas w x h
const gambarDarat = (g, w, h, darat, kotak, isi, garis, tebal) => {
  const [lon0, lon1, lat0, lat1] = kotak, xy = ([lon, lat]) => [((lon - lon0) / (lon1 - lon0)) * w, ((lat1 - lat) / (lat1 - lat0)) * h];
  g.beginPath();
  for (const f of darat.features) for (const poli of f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates) for (const cincin of poli) { cincin.forEach((c, i) => { const [x, y] = xy(c); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); }
  g.fillStyle = isi; g.fill("evenodd"); if (garis) { g.strokeStyle = garis; g.lineWidth = tebal; g.lineJoin = "round"; g.stroke(); }
};
// lampu kota: piksel Black Marble yang terang saja, diwarnai kuning lampu
const gambarLampu = (g, w, h, malam) => {
  const c = document.createElement("canvas"); c.width = malam.width; c.height = malam.height; const k = c.getContext("2d"); k.drawImage(malam, 0, 0);
  const d = k.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const l = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2], a = Math.max(0, Math.min(1, (l - 45) / 80)) * (p[i] - p[i + 2] > 12 ? 1 : 0.1); p[i] = 255; p[i + 1] = 196 + 40 * a; p[i + 2] = 110 + 80 * a; p[i + 3] = a * 255; }
  k.putImageData(d, 0, 0); g.globalCompositeOperation = "lighter"; g.drawImage(c, 0, 0, w, h); g.globalCompositeOperation = "source-over";
};

const langitMalam = () => {
  scene.background = new THREE.Color(TERANG ? 0x1f2440 : 0x07090f);
  const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(4000); p.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff1d6, size: 2, sizeAttenuation: false })));
  document.body.classList.remove("terang"); document.body.classList.add("malam");
};
// meja kerja di y = 0,75 m
const meja = (w = 1.6, d = 0.75) => {
  kotak(8, 0.02, 8, M.lantai, 0, -0.01, 0);
  kotak(8, 3, 0.05, clay(0x3a322b), 0, 1.5, -0.6);
  kotak(w, 0.04, d, clay(0x9c8a74), 0, 0.73, 0);
  for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) kotak(0.04, 0.71, 0.04, M.gelap, x * (w / 2 - 0.05), 0.355, z * (d / 2 - 0.05));
};
const tumpukanMap = (x, z, n = 9) => { for (let i = 0; i < n; i++) { const o = kotak(0.32, 0.028, 0.24, clay(i % 3 ? 0xa89c8c : 0x8c7f70), x + Math.sin(i * 7) * 0.012, 0.765 + i * 0.03, z + Math.cos(i * 5) * 0.012); o.rotation.y = Math.sin(i * 3) * 0.08; } };
const notaBahan = TERANG ? new THREE.MeshToonMaterial({ color: 0xb8322a, gradientMap: ramp }) : M.merah;
const nota = (x, y, z, par = scene, ry = 0) => { const o = kotak(0.08, 0.003, 0.12, notaBahan, x, y, z, par); o.rotation.y = ry; return o; };
const timbangan = (x, z, miring = 0.2, s = 1) => {
  const g = new THREE.Group(); g.position.set(x, 0.75, z); g.scale.setScalar(s); scene.add(g);
  silinder(0.09, 0.02, M.kuning, 0, 0.01, 0, g); silinder(0.008, 0.32, M.kuning, 0, 0.17, 0, g);
  const balok = new THREE.Group(); balok.position.y = 0.33; balok.rotation.z = miring; g.add(balok);
  kotak(0.42, 0.012, 0.012, M.kuning, 0, 0, 0, balok);
  const piring = [];
  for (const sx of [-1, 1]) {
    const tali = new THREE.Group(); tali.position.x = sx * 0.2; balok.add(tali); tali.rotation.z = -miring;
    kotak(0.002, 0.16, 0.002, M.gelap, 0, -0.08, 0, tali);
    const pr = silinder(0.07, 0.008, M.kuning, 0, -0.16, 0, tali); piring.push(pr);
  }
  return { g, piring };
};
const monitor = (x, z, gambar, w = 0.56, h = 0.33, ry = 0) => {
  const g = new THREE.Group(); g.position.set(x, 0.75, z); g.rotation.y = ry; scene.add(g);
  kotak(0.18, 0.012, 0.14, M.gelap, 0, 0.006, 0, g); kotak(0.03, 0.16, 0.03, M.gelap, 0, 0.09, -0.02, g);
  kotak(w + 0.02, h + 0.02, 0.02, M.gelap, 0, 0.17 + h / 2, -0.03, g);
  const l = new THREE.Mesh(new THREE.PlaneGeometry(w, h), layar(1024, 600, gambar, 0.9)); l.position.set(0, 0.17 + h / 2, -0.019); g.add(l);
  return g;
};
const lembarKerja = (g, w, h) => { g.fillStyle = "#e9e5dc"; g.fillRect(0, 0, w, h); g.strokeStyle = "#b7b1a6"; for (let x = 0; x < w; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); } for (let y = 0; y < h; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } g.fillStyle = "#6f695f"; g.font = "18px monospace"; for (let y = 50; y < h; y += 30) for (let x = 12; x < w; x += 90) if ((x + y) % 7) g.fillText(String((x * 13 + y * 7) % 9000), x, y - 8); };
const orang = (x, z, duduk = false, m = clay(0x8f857a)) => { const tinggi = duduk ? 1.25 : 1.7; const o = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, tinggi - 0.6, 6, 16), m); o.position.set(x, tinggi / 2 + (duduk ? 0.0 : 0), z); o.castShadow = true; scene.add(o); const k = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), m); k.position.set(x, tinggi + 0.08, z); k.castShadow = true; scene.add(k); };
const kursi = (x, z) => { kotak(0.46, 0.05, 0.46, M.gelap, x, 0.46, z); kotak(0.46, 0.5, 0.05, M.gelap, x, 0.73, z + 0.21); silinder(0.025, 0.44, M.gelap, x, 0.22, z); };

// ---------- adegan ----------
const ADEGAN = {
  dorongan() {
    meja(); lampuDasar(1.2, 0.25);
    const lampuMeja = new THREE.PointLight(AMB, 2.2, 3, 2); lampuMeja.position.set(-0.55, 1.25, 0.1); lampuMeja.castShadow = true; scene.add(lampuMeja);
    tumpukanMap(-0.42, -0.2, 11); tumpukanMap(-0.16, -0.27, 6);
    monitor(0.58, -0.26, lembarKerja, 0.5, 0.3, -0.25);
    const jam = silinder(0.13, 0.02, clay(0xd9d2c6), -0.45, 1.42, -0.57); jam.rotation.x = Math.PI / 2;
    const jarum = (pjg, sudut) => { const o = kotak(0.008, pjg, 0.004, M.gelap, 0, 0, 0); o.geometry.translate(0, pjg / 2, 0); o.position.set(-0.45, 1.42, -0.555); o.rotation.z = -sudut; };
    jarum(0.09, (22 + 10 / 60) / 12 * Math.PI * 2); jarum(0.13, (10 / 60) * Math.PI * 2);
    const t = timbangan(0.12, 0.16, 0.22, 1.25); nota(0, 0.007, 0, t.piring[0], 0.3);
    lihat(HP ? [0.25, 1.5, 2.2] : [0.35, 1.42, 1.5], HP ? [0.08, 1.05, 0] : [0.08, 0.95, 0]);
  },
  "harga-diam"() {
    meja(); lampuDasar(1.4, 0.3); tumpukanMap(-0.45, -0.1, 8);
    const t = timbangan(0.15, 0.05, 0.34, 1.1);
    nota(0.0, 0.007, 0.02, t.piring[0]);
    silinder(0.028, 0.05, M.kuning, -0.03, 0.03, -0.02, t.piring[0]); silinder(0.022, 0.04, M.kuning, 0.035, 0.025, 0.02, t.piring[0]);
    label("LEMBUR", -0.06, 0.22, -0.02, 0.022, "#f0b35a", t.piring[0]); label("SELISIH STOK", 0.06, 0.16, 0.03, 0.02, "#f0b35a", t.piring[0]);
    lihat(HP ? [0.25, 1.15, 1.05] : [0.42, 1.08, 0.72], HP ? [0.06, 0.95, 0.05] : [0.04, 0.95, 0.05]);
  },
  tarikan() {
    meja(); scene.add(new THREE.HemisphereLight(0xfff1dc, 0x201812, 0.12));
    tumpukanMap(-0.4, -0.05, 9);
    const g = new THREE.Group(); g.position.set(0.1, 0.75, 0.05); g.rotation.set(0, -0.25, 0); scene.add(g);
    kotak(0.1, 0.012, 0.08, M.gelap, 0, 0.006, 0, g);
    const hp = kotak(0.078, 0.162, 0.008, M.gelap, 0, 0.1, -0.01, g); hp.rotation.x = -0.25;
    const isi = (c, w, h) => { c.fillStyle = "#211a15"; c.fillRect(0, 0, w, h); c.fillStyle = "#ece8e1"; c.font = "600 40px system-ui"; c.fillText("Hari ini", 40, 90); const baris = [["Penjualan", "Rp18,4 jt"], ["Stok menipis", "6 barang"], ["Kas", "cocok"]]; c.font = "30px system-ui"; baris.forEach(([a, b], i) => { c.fillStyle = "#b3ada4"; c.fillText(a, 40, 190 + i * 110); c.fillStyle = i === 2 ? "#e0574b" : "#ece8e1"; c.font = "600 44px system-ui"; c.fillText(b, 40, 240 + i * 110); c.font = "30px system-ui"; }); c.strokeStyle = "#e0574b"; c.lineWidth = 6; c.beginPath(); [[40, 700], [120, 660], [200, 680], [280, 600], [340, 620]].forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); };
    const l = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.15), layar(380, 800, isi, 1.4)); l.position.set(0, 0, 0.0045); hp.add(l);
    { const t = timbangan(-0.12, 0.2, 0.26, 0.8); nota(0, 0.007, 0, t.piring[0]); }
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x201812, 0.12)); const cahaya = new THREE.PointLight(0xdfe8ff, 0.06, 1.2, 2); cahaya.position.set(0.1, 0.95, 0.2); cahaya.castShadow = true; scene.add(cahaya);
    lihat(HP ? [0.42, 1.05, 0.62] : [0.48, 0.98, 0.5], [0.0, 0.85, 0.0]);
  },
  biaya() {
    kotak(3, 0.02, 3, clay(0x9c8a74), 0, -0.01, 0); lampuDasar(1.5, 0.35);
    const kertas = new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.297), new THREE.MeshStandardMaterial({ map: tekstur(420, 594, (g, w, h) => { g.fillStyle = "#ece8e1"; g.fillRect(0, 0, w, h); g.fillStyle = "#1d1b19"; g.font = "600 26px system-ui"; g.fillText("Lingkup kerja", 30, 50); g.font = "18px system-ui"; ["1. Kasir dan stok", "2. Laporan cabang", "Di luar lingkup: integrasi pajak"].forEach((s, i) => g.fillText(s, 30, 100 + i * 34)); g.fillRect(30, 520, 160, 2); g.fillText("Disetujui", 30, 550); }), roughness: 0.9 }));
    kertas.rotation.x = -Math.PI / 2; kertas.rotation.z = 0.04; kertas.position.set(-0.24, 0.002, 0); kertas.receiveShadow = true; scene.add(kertas);
    const warna = [M.merah, M.clay, clay(0x8c8478)];
    for (let i = 0; i < 3; i++) { kotak(0.08, 0.04 + i * 0.015, 0.08, warna[i], -0.04 + i * 0.1, 0.02 + i * 0.0075, -0.02); label(`TAHAP ${i + 1}`, -0.04 + i * 0.1, 0.002, 0.06, 0.02, "#ece8e1"); }
    const kartu = kotak(0.07, 0.004, 0.05, M.merah, 0.1, 0.06, 0.13); kartu.rotation.y = 0.5;
    label("TAMBAHAN", 0.1, 0.08, 0.17, 0.02, "#e0574b");
