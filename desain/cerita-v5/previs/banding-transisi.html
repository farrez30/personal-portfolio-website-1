<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banding transisi antarmeja</title>
<style>:root{color-scheme:dark}body{margin:0;background:#1a1410;color:#ece8e1;font-family:system-ui,sans-serif;padding:24px 16px 48px}h1{font-size:26px;margin:0 0 6px}p{color:#b3ada4;line-height:1.5;margin:0 0 18px;max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:22px}figure{margin:0}video{width:100%;display:block;border:1px solid #3a322b;background:#000}
figcaption{padding:10px 0}figcaption b{display:block;font-size:18px;margin-bottom:4px}figcaption span{color:#b3ada4;font-size:15px;line-height:1.45}a{color:#f0b35a}</style></head><body>
<h1>Perpindahan antarmeja, empat arah</h1><p>Bagian kantor saja, dari babak 1 sampai babak 7. Video dimulai bersamaan bila ditekan <a href="#" id="semua">putar semua</a>; satu video diputar sendiri menghentikan yang lain.</p>
<div class="grid"><figure><video src="tx-campur.mp4" controls muted preload="metadata" playsinline></video><figcaption><b>Tata ulang dan pola campur</b><span>Meja di dua sisi lorong. Nota terbang diikuti kamera, whip pan ke seberang, masuk layar tablet lalu keluar di meja biaya, orbit, lewat di balik pilar, crane ke denah.</span> <a href="kontak-tx-campur.jpg">Lembar kontak</a></figcaption></figure><figure><video src="tx-layar.mp4" controls muted preload="metadata" playsinline></video><figcaption><b>Masuk layar berantai</b><span>Di tiap meja ada tablet dengan layar yang sama. Kamera masuk ke layar sampai penuh, lalu keluar dari tablet di meja berikutnya.</span> <a href="kontak-tx-layar.jpg">Lembar kontak</a></figcaption></figure><figure><video src="tx-crane.mp4" controls muted preload="metadata" playsinline></video><figcaption><b>Crane ke denah</b><span>Plafon dibuka seperti rumah boneka. Kamera naik ke tampak atas lantai, bergeser, lalu turun di meja berikutnya.</span> <a href="kontak-tx-crane.jpg">Lembar kontak</a></figcaption></figure><figure><video src="tx-oner.mp4" controls muted preload="metadata" playsinline></video><figcaption><b>Satu take berliku</b><span>Tata letak tetap. Kamera tidak pernah berhenti: bergantian merendah ke lorong dan meninggi di atas meja.</span> <a href="kontak-tx-oner.jpg">Lembar kontak</a></figcaption></figure></div>
<script>const v=[...document.querySelectorAll("video")];let bareng=false;v.forEach(x=>x.addEventListener("play",()=>{if(!bareng)v.forEach(y=>y!==x&&y.pause())}));
document.getElementById("semua").onclick=e=>{e.preventDefault();bareng=true;v.forEach(x=>{x.currentTime=0;x.play()});setTimeout(()=>bareng=false,500)};</script></body></html>
