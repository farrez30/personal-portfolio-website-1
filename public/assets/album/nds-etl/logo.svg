<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Teal badge with a white pixel "N" monogram. Vector rects only (no font) so it
       renders identically as a tab favicon across browsers. Full NDS+ETL lockup lives
       in apple-icon.png (Home Screen). Regenerate with: node web/scripts/gen-icons.js -->
  <rect width="64" height="64" rx="12" fill="#0b6b7a"/>
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="12" y="4" width="8" height="8"/>
    <rect x="44" y="4" width="8" height="8"/>
    <rect x="12" y="12" width="8" height="8"/>
    <rect x="20" y="12" width="8" height="8"/>
    <rect x="44" y="12" width="8" height="8"/>
    <rect x="12" y="20" width="8" height="8"/>
    <rect x="20" y="20" width="8" height="8"/>
    <rect x="44" y="20" width="8" height="8"/>
    <rect x="12" y="28" width="8" height="8"/>
    <rect x="28" y="28" width="8" height="8"/>
    <rect x="44" y="28" width="8" height="8"/>
    <rect x="12" y="36" width="8" height="8"/>
    <rect x="36" y="36" width="8" height="8"/>
    <rect x="44" y="36" width="8" height="8"/>
    <rect x="12" y="44" width="8" height="8"/>
    <rect x="36" y="44" width="8" height="8"/>
    <rect x="44" y="44" width="8" height="8"/>
    <rect x="12" y="52" width="8" height="8"/>
    <rect x="44" y="52" width="8" height="8"/>
  </g>
</svg>
